<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinevault - Direction C, Title Sequence</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   DESIGN TOKENS  (port these to Angular as CSS custom properties / theme)
   World: 1960s-70s title sequence + theatrical one-sheet.
   Ground = warm ink. ONE signal colour = marquee vermilion, used in big planes.
   ========================================================================== */
:root{
  /* colour: ground + paper + signal */
  --ground:#15100D;      /* page ink */
  --ground-2:#1F1814;    /* raised plane */
  --ground-3:#2C231D;    /* fills / borders only, never signal text on it */
  --rule:#52443A;        /* ruled lines */
  --rule-soft:#33291F;
  --bone:#F1E8D4;        /* paper / type */
  --bone-dim:#BFB39B;    /* secondary type on ground (9:1) */
  --ink-2:#4A3D33;       /* secondary type on bone (8:1) */
  --signal:#F04A22;      /* marquee vermilion: 5.1:1 vs ground; ground text on it 5.1:1 */
  --signal-hot:#FF6A3D;  /* hover on signal planes */
  --signal-deep:#C73A12; /* large numerals on bone (4.2:1) */
  --on-signal:#15100D;
  /* type */
  --f-display:'Big Shoulders Display','Bebas Neue','Arial Narrow',Impact,sans-serif;
  --f-body:'Archivo','Segoe UI',system-ui,-apple-system,Helvetica,sans-serif;
  --f-mono:'Courier Prime','Courier New',ui-monospace,monospace;
  --fs-label:.75rem;      /* 12px */
  --fs-sm:.875rem;        /* 14px */
  --fs-body:1rem;
  --fs-lead:1.125rem;
  --fs-h3:1.5rem;
  --fs-h2:clamp(2rem,5vw,3rem);
  --fs-h1:clamp(3rem,9vw,4.5rem);
  --fs-d1:clamp(3.4rem,12.5vw,6rem);   /* one-sheet title, 96px cap */
  --fs-stat:clamp(4.5rem,20vw,6rem);
  --fs-row:clamp(1.8rem,3.1vw,3rem);
  --fs-num:clamp(3rem,5vw,4.5rem);
  /* space */
  --s-1:.25rem;--s-2:.5rem;--s-3:.75rem;--s-4:1rem;--s-5:1.5rem;--s-6:2rem;--s-7:3rem;--s-8:4.5rem;--s-9:6rem;
  /* radius: cut paper is square; notch is the signature curve */
  --r-0:0;--r-1:2px;--r-2:6px;--r-pill:999px;--notch:8px;
  /* layout + motion */
  --nav-h:60px;
  --gutter:clamp(16px,4vw,40px);
  --page-max:1440px;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --t-wipe:420ms;
  /* mockup bar (outside product chrome) */
  --mock-bg:#E4E1DA;--mock-fg:#1d1d1d;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark;-webkit-text-size-adjust:100%;scrollbar-color:var(--rule) var(--ground)}
body{margin:0;background:var(--ground);color:var(--bone);font:400 var(--fs-body)/1.55 var(--f-body);min-height:100vh;display:flex;flex-direction:column;accent-color:var(--signal);caret-color:var(--signal)}
::selection{background:var(--signal);color:var(--on-signal)}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track{background:var(--ground)}::-webkit-scrollbar-thumb{background:var(--rule);border:3px solid var(--ground)}::-webkit-scrollbar-thumb:hover{background:var(--bone-dim)}
[hidden]{display:none!important}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:2px}
img,svg{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--bone);outline-offset:3px}
.on-signal :focus-visible,.on-signal:focus-visible,.on-bone :focus-visible{outline-color:var(--ground)}
.skip{position:absolute;left:-999px;top:0;background:var(--bone);color:var(--ground);padding:var(--s-3) var(--s-4);z-index:200;font-weight:700}
.skip:focus{left:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:var(--page-max);margin:0 auto;padding-inline:var(--gutter);width:100%}
.mono{font-family:var(--f-mono);letter-spacing:0}
.disp{font-family:var(--f-display);text-transform:uppercase;font-weight:900;letter-spacing:.005em}
.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
main{flex:1;outline:none}
main.wipe{animation:wipe var(--t-wipe) var(--ease-out) backwards}
@keyframes wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes wipeX{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* ---------- mockup switcher (NOT product) ---------- */
.mock{background:var(--mock-bg);color:var(--mock-fg);font:500 12px/1.3 system-ui,sans-serif;padding:6px 10px;display:flex;align-items:center;gap:6px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #888}
.mock b{font-weight:700;margin-right:4px}
.mock a,.mock button{flex:none;padding:6px 9px;border:1px solid #8b8780;border-radius:4px;background:#fff;color:#1d1d1d;text-decoration:none;font:500 12px/1 system-ui,sans-serif;min-height:30px;display:inline-flex;align-items:center}
.mock a[aria-current="page"],.mock button[aria-pressed="true"]{background:#1d1d1d;color:#fff;border-color:#1d1d1d}
.mock :focus-visible{outline:2px solid #0a4fd1;outline-offset:2px}
.mock .sep{flex:none;width:1px;height:18px;background:#8b8780;margin:0 4px}
.mock .note{flex:none;color:#4a4742}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:60;background:var(--ground);border-bottom:2px solid var(--bone)}
.nav-in{max-width:1600px;margin:0 auto;display:flex;align-items:stretch;height:var(--nav-h);padding-left:var(--gutter)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--bone);margin-right:var(--s-5)}
.brand svg{width:34px;height:34px}
.brand span{font:900 1.75rem/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.nav-links{display:none}
.nav-links a{display:flex;align-items:center;height:100%;padding:0 var(--s-4);font:700 var(--fs-sm)/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;text-decoration:none;color:var(--bone)}
.nav-links a:hover{background:var(--ground-3)}
.nav-links a[aria-current="page"]{background:var(--signal);color:var(--on-signal)}
.nav-links a:focus-visible{outline-offset:-5px}
.nav-end{margin-left:auto;display:flex;align-items:stretch}
.search{display:none;align-items:center;gap:8px;margin:10px 12px 10px 0;padding:0 12px;border:2px solid var(--rule);background:var(--ground-2);min-width:220px}
.search input{background:none;border:0;outline:none;min-height:36px;width:100%;font-size:var(--fs-sm)}
.search input::placeholder{color:var(--bone-dim);opacity:1}
.search:focus-within{border-color:var(--bone)}
.me{display:flex;align-items:center;gap:10px;padding:0 var(--gutter) 0 var(--s-3);text-decoration:none}
.me .av{width:40px;height:40px;background:var(--bone);color:var(--ground);display:grid;place-items:center;font:900 1.2rem/1 var(--f-display);letter-spacing:.03em}
.me .nm{display:none;font:700 var(--fs-sm)/1.1 var(--f-body)}
.me .nm small{display:block;font:400 var(--fs-label)/1.3 var(--f-mono);color:var(--bone-dim);margin-top:2px}
.nav-auth{display:none;align-items:center;gap:8px;padding-right:var(--gutter)}
.menu-btn{width:var(--nav-h);border:0;border-left:2px solid var(--bone);background:var(--ground);display:grid;place-items:center}
.menu-btn .ic{width:26px;height:26px}
.menu-btn[aria-expanded="true"]{background:var(--signal);color:var(--on-signal)}
.menu{position:absolute;left:0;right:0;top:100%;background:var(--signal);color:var(--on-signal);padding:var(--s-4) var(--gutter) var(--s-6);animation:wipe var(--t-wipe) var(--ease-out) backwards;max-height:calc(100vh - var(--nav-h));overflow:auto}
.menu a.big{display:flex;align-items:center;justify-content:space-between;min-height:56px;font:900 2.4rem/1 var(--f-display);text-transform:uppercase;text-decoration:none;border-bottom:2px solid var(--on-signal)}
.menu a.big[aria-current="page"]{text-decoration:underline;text-decoration-thickness:4px}
.menu .search{display:flex;margin:0 0 var(--s-4);background:var(--ground);min-width:0;border-color:var(--ground)}
.menu .search:focus-within{border-color:var(--bone)}
.menu .msub{display:flex;gap:10px;margin-top:var(--s-4);flex-wrap:wrap}
@media (min-width:960px){
  .nav-links{display:flex}.search{display:flex}.me .nm{display:block}.menu-btn,.menu{display:none}.nav-auth{display:flex}
  .nav-in{padding-left:var(--gutter)}
}
@media (min-width:960px) and (max-width:1180px){.search{min-width:150px}.nav-links a{padding:0 var(--s-3)}}

/* ---------- ticket-stub buttons ---------- */
.btn{--n:var(--notch);display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:48px;padding:0 var(--s-5);border:0;border-radius:0;background:var(--bone);color:var(--ground);font:700 var(--fs-sm)/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;text-decoration:none;white-space:nowrap;
  -webkit-mask:radial-gradient(circle var(--n) at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--n) at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle var(--n) at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--n) at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
  transition:background-color .12s,color .12s}
.btn:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--ground),inset 0 0 0 6px var(--bone)}
.on-signal .btn:focus-visible,.on-bone .btn:focus-visible{box-shadow:inset 0 0 0 3px var(--bone),inset 0 0 0 6px var(--ground)}
.btn--signal{background:var(--signal);color:var(--on-signal)}.btn--signal:hover{background:var(--signal-hot)}
.btn--bone{background:var(--bone);color:var(--ground)}.btn--bone:hover{background:#fff}
.btn--ink{background:var(--ground);color:var(--bone)}.btn--ink:hover{background:var(--ground-3)}
.btn--line{background:transparent;color:var(--bone);box-shadow:inset 0 0 0 2px var(--bone-dim)}.btn--line:hover{background:var(--ground-3)}
.btn--dash{background:transparent;color:inherit;box-shadow:none;border:2px dashed currentColor}
.btn--dash:hover{background:rgba(0,0,0,.12)}
.btn--flat{-webkit-mask:none;mask:none;min-height:44px;padding:0 var(--s-4)}
.btn--flat:focus-visible{outline:3px solid var(--bone);outline-offset:2px;box-shadow:none}
.btn--sm{min-height:44px;padding:0 var(--s-4)}
.btn--danger{background:transparent;color:var(--signal);box-shadow:inset 0 0 0 2px var(--signal)}.btn--danger:hover{background:var(--signal);color:var(--on-signal)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:1;background:var(--ground-3);color:var(--bone-dim);cursor:not-allowed;box-shadow:none}
.btn .ic{width:1.15em;height:1.15em}
.flag{display:inline-flex;align-items:center;margin-left:var(--s-2);padding:3px 8px;background:var(--ground);color:var(--bone);font:700 var(--fs-label)/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;vertical-align:middle}
.dl{display:inline-flex;align-items:center}
.link-btn{background:none;border:0;padding:0;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.22em;font-weight:600;min-height:44px}

/* ---------- genre ticker ---------- */
.ticker{display:flex;align-items:stretch;border-bottom:2px solid var(--bone);background:var(--ground-2)}
.ticker-btn{flex:none;width:56px;border:0;background:var(--bone);color:var(--ground);display:grid;place-items:center}
.ticker-btn:focus-visible{outline-offset:-6px;outline-color:var(--ground)}
.ticker-view{overflow:hidden;flex:1;min-width:0}
.ticker-track{display:flex;gap:10px;padding:10px 5px;width:max-content;animation:tick 70s linear infinite}
.ticker.is-paused .ticker-track,.ticker-view:hover .ticker-track,.ticker-view:focus-within .ticker-track{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.cut{display:flex;align-items:center;min-height:44px;padding:0 26px;font:900 1.4rem/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;text-decoration:none;white-space:nowrap;background:var(--signal);color:var(--on-signal);clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.cut:nth-child(4n+2){background:var(--bone);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%)}
.cut:nth-child(4n+3){background:var(--ground-3);color:var(--bone);clip-path:polygon(0 0,100% 0,100% 100%,16px 100%,0 calc(100% - 16px))}
.cut:nth-child(4n){background:var(--bone);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%)}
.cut:hover{filter:brightness(1.12)}
.cut:focus-visible{outline:3px solid var(--ground);outline-offset:-7px}
.cut:nth-child(4n+3):focus-visible{outline-color:var(--bone)}
@media (prefers-reduced-motion:reduce){
  .ticker-track{animation:none}.ticker-view{overflow-x:auto}.ticker-btn,.cut[aria-hidden="true"]{display:none}
  main.wipe,.menu{animation:none}
}

/* ---------- home: program ---------- */
.program{max-width:1600px;margin:0 auto;width:100%}
.index{padding:0 0 var(--s-8)}
.grp{display:flex;align-items:baseline;gap:var(--s-4);margin:var(--s-6) var(--gutter) 0;padding-bottom:var(--s-2);border-bottom:6px solid var(--bone)}
.grp:first-child{margin-top:var(--s-2)}
.grp h2{font:900 var(--fs-h2)/1 var(--f-display);text-transform:uppercase;color:var(--signal);letter-spacing:.01em}
.grp p{font:400 var(--fs-sm)/1.3 var(--f-mono);color:var(--bone-dim)}
.row{position:relative;border-bottom:1px solid var(--rule);margin:0 var(--gutter)}
.row-link{display:grid;gap:var(--s-2) var(--s-4);text-decoration:none;color:var(--bone)}
.row-num{font:900 var(--fs-num)/.9 var(--f-display);font-variant-numeric:tabular-nums;color:var(--signal)}
.row-title{font:900 var(--fs-row)/.92 var(--f-display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.row-meta{font:400 var(--fs-sm)/1.35 var(--f-mono);color:var(--bone-dim)}
.row-meta b{font-weight:700;color:var(--bone)}
.row-add{display:none}
.row-card{display:grid;grid-template-columns:1fr 112px;gap:var(--s-4);margin-top:var(--s-4)}
.row-card .syn{font-size:var(--fs-sm);color:var(--bone);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.row-card .acts{grid-column:1/-1;display:flex;gap:var(--s-3);flex-wrap:wrap}
.row{padding:var(--s-5) 0}
.poster{position:relative;display:block;aspect-ratio:2/3;background:var(--ground-3);overflow:hidden}
.poster svg{width:100%;height:100%}
.pv{display:none}
@media (min-width:900px){
  .program{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);align-items:start}
  .row{padding:0;margin:0 0 0 var(--gutter);display:flex;isolation:isolate}
  .row::before{content:"";position:absolute;inset:0;background:var(--bone);clip-path:inset(0 100% 0 0);transition:clip-path 320ms var(--ease-out);z-index:-1}
  .row.is-active::before{clip-path:inset(0 0 0 0)}
  .row-link{flex:1;min-width:0;grid-template-columns:clamp(76px,7vw,108px) minmax(0,1fr) auto;align-items:center;padding:var(--s-3) var(--s-4);min-height:92px}
  .row-meta{text-align:right}
  .row-card{display:none}
  .row-add{display:grid;place-items:center;width:56px;border:0;background:none;color:var(--bone-dim)}
  .row-add:hover{color:var(--signal)}
  .row.is-active .row-link,.row.is-active .row-add{color:var(--ground)}
  .row.is-active .row-num{color:var(--signal-deep)}
  .row.is-active .row-meta{color:var(--ink-2)}.row.is-active .row-meta b{color:var(--ground)}
  .row.is-active .row-add:hover{color:var(--signal-deep)}
  .row-add[aria-pressed="true"]{color:var(--signal)}
  .row.is-active .row-add[aria-pressed="true"]{color:var(--signal-deep)}
  .row-link:focus-visible,.row-add:focus-visible{outline-offset:-6px}
  .row.is-active :focus-visible{outline-color:var(--ground)}
  .grp{margin-left:var(--gutter);margin-right:0}
  .pv{display:block;position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));background:var(--signal);color:var(--on-signal);overflow:hidden;margin-top:0}
  .pv-body{height:100%;padding:var(--s-5) var(--gutter) var(--s-5) var(--s-5);display:flex;flex-direction:column}
  .pv-body.wipe{animation:wipeX 460ms var(--ease-out) backwards}
  .pv-back{height:clamp(160px,37vh,350px);flex:none;overflow:hidden;clip-path:polygon(0 0,calc(100% - 34px) 0,100% 34px,100% 100%,0 100%);background:var(--ground)}
  .pv-back svg{width:100%;height:100%}
  .pv-mid{display:grid;grid-template-columns:clamp(120px,10.5vw,160px) 1fr;gap:var(--s-4) var(--s-5);margin-top:calc(-1 * clamp(56px,10vh,100px));padding-left:var(--s-4);position:relative}
  .pv-mid .poster{box-shadow:0 18px 28px -10px rgba(0,0,0,.55);transform:rotate(-2deg)}
  .pv-head{align-self:end;min-width:0}
  .pv-num{font:900 clamp(3.5rem,6vw,5.5rem)/.85 var(--f-display);font-variant-numeric:tabular-nums;display:block}
  .pv-title{font:900 clamp(2rem,3.6vw,3.6rem)/.9 var(--f-display);text-transform:uppercase;text-wrap:balance;margin-top:var(--s-2)}
  .pv-meta{font:700 var(--fs-sm)/1.4 var(--f-mono);margin-top:var(--s-4)}
  .pv-syn{font-size:var(--fs-body);margin-top:var(--s-2);max-width:56ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .pv-acts{display:flex;gap:var(--s-3);flex-wrap:wrap;padding-top:var(--s-5)}
}
@media (min-width:900px) and (max-height:760px){.pv-back{height:150px}.pv-syn{-webkit-line-clamp:2}}

/* ---------- title: the one-sheet ---------- */
.sheet{--fg:var(--on-signal);--a-bg:var(--ground);--a-fg:var(--bone);--b-bg:var(--bone);--b-fg:var(--ground)}
.sheet-field{background:var(--signal);color:var(--fg);overflow:hidden;border-bottom:2px solid var(--bone)}
.sheet--bone{--fg:var(--ground);--a-bg:var(--signal);--a-fg:var(--on-signal);--b-bg:var(--ground);--b-fg:var(--bone)}
.sheet--bone .sheet-field{background:var(--bone)}
.sheet-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s-6);padding-block:var(--s-6) var(--s-7)}
.sheet-title{font:900 var(--fs-d1)/.86 var(--f-display);text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere;letter-spacing:0}
.sheet-sub{font:700 var(--fs-body)/1.4 var(--f-mono);margin-top:var(--s-4)}
.tags{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-top:var(--s-3)}
.tags li{padding:6px 14px;background:var(--ground);color:var(--bone);font:900 1.1rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.slate{margin-top:var(--s-5);border:3px solid var(--fg);max-width:560px}
.slate::before{content:"";display:block;height:16px;background:repeating-linear-gradient(115deg,var(--fg) 0 16px,transparent 16px 32px);border-bottom:3px solid var(--fg)}
.slate{display:grid;grid-template-columns:repeat(2,1fr)}.slate::before{grid-column:1/-1}
.slate div{padding:var(--s-2) var(--s-3) var(--s-3);border-right:3px solid var(--fg);border-bottom:3px solid var(--fg)}
.slate div:nth-child(2n){border-right:0}.slate div:nth-last-child(-n+2){border-bottom:0}
.slate dt{font:700 var(--fs-label)/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.slate dd{font:900 1.9rem/1.05 var(--f-display);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.slate dd small{font:700 var(--fs-sm)/1 var(--f-mono)}
.slate .ic{width:.8em;height:.8em;fill:currentColor;stroke:none}
.stubs{display:flex;flex-wrap:wrap;gap:var(--s-3) var(--s-3);margin-top:var(--s-5);align-items:center}
.sheet .btn--a{background:var(--a-bg);color:var(--a-fg)}
.sheet .btn--b{background:var(--b-bg);color:var(--b-fg)}
.sheet .btn--a:hover,.sheet .btn--b:hover{filter:brightness(1.15)}
.sheet .btn--dash{color:var(--fg);background:transparent}
.cutouts{position:relative;max-width:520px;width:100%;aspect-ratio:1.15}
.cutouts .back{position:absolute;right:0;top:0;width:90%;aspect-ratio:16/10;overflow:hidden;background:var(--ground);clip-path:polygon(0 0,calc(100% - 40px) 0,100% 40px,100% 100%,0 100%)}
.cutouts .back svg{width:100%;height:100%}
.cutouts .poster{position:absolute;left:0;bottom:0;width:44%;border:5px solid var(--bone);transform:rotate(-3deg);box-shadow:0 22px 30px -10px rgba(0,0,0,.6)}
.sheet--bone .cutouts::before{content:"";position:absolute;inset:14% -8% -6% 20%;background:var(--signal)}
.sheet--bone .cutouts .poster{border-color:var(--ground)}
.sheet--bone .cutouts .back{z-index:1}.sheet--bone .cutouts .poster{z-index:2}
.sheet-body{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s-7);padding-block:var(--s-7)}
.sec h2{font:900 var(--fs-h2)/1 var(--f-display);text-transform:uppercase;border-bottom:6px solid var(--bone);padding-bottom:var(--s-2);margin-bottom:var(--s-4)}
.story p{font-size:var(--fs-lead);max-width:62ch;line-height:1.6}
.credits{display:grid;grid-template-columns:minmax(92px,.34fr) 1fr;gap:var(--s-4) var(--s-5)}
.credits dt{font:700 var(--fs-label)/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--bone-dim);text-align:right;padding-top:8px}
.credits dd{font:900 clamp(1.5rem,3.4vw,1.9rem)/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.credits dd li+li{margin-top:var(--s-3)}
.credits dd small{display:block;font:400 var(--fs-sm)/1.3 var(--f-mono);text-transform:none;letter-spacing:0;color:var(--bone-dim);margin-top:2px}
.credits .plain{font-size:1.4rem}
.seasons{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-bottom:var(--s-4)}
.seasons button{min-height:44px;padding:0 var(--s-5);border:0;background:var(--ground-3);color:var(--bone);font:900 1.3rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 100%,0 100%)}
.seasons button[aria-pressed="true"]{background:var(--signal);color:var(--on-signal)}
.seasons button:focus-visible{outline-offset:-6px}
.eps li{display:grid;grid-template-columns:3.4rem 1fr auto;gap:var(--s-3);align-items:baseline;padding:var(--s-3) 0;border-bottom:1px solid var(--rule)}
.eps .e{font:700 var(--fs-sm)/1 var(--f-mono);color:var(--signal)}
.eps .n{font-weight:600}
.eps .d{font:400 var(--fs-sm)/1 var(--f-mono);color:var(--bone-dim)}
.more{padding-bottom:var(--s-8)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,42%);gap:var(--s-4);overflow-x:auto;padding-bottom:var(--s-3);scroll-snap-type:x proximity}
.rail a{text-decoration:none;scroll-snap-align:start}
.rail .poster{transition:transform .25s var(--ease-out)}
.rail a:hover .poster{transform:translateY(-6px) rotate(-1.5deg)}
.rail .cap{margin-top:var(--s-2);font:900 1.25rem/1 var(--f-display);text-transform:uppercase}
.rail .cap small{display:block;font:400 var(--fs-label)/1.4 var(--f-mono);color:var(--bone-dim);margin-top:4px;text-transform:none}
@media (min-width:760px){
  .sheet-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:center;padding-block:var(--s-7) var(--s-8)}
  .slate{grid-template-columns:repeat(4,1fr)}
  .slate div{border-bottom:0}.slate div:nth-child(2n){border-right:3px solid var(--fg)}.slate div:last-child{border-right:0}
  .sheet-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s-7) var(--s-8)}
  .sheet-body .full{grid-column:1/-1}
  .rail{grid-auto-flow:row;grid-template-columns:repeat(6,1fr);grid-auto-columns:auto;overflow:visible}
}

/* ---------- dashboard shell ---------- */
.dash{max-width:var(--page-max);margin:0 auto;width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.side{border-bottom:2px solid var(--bone);background:var(--ground)}
.side-who{display:none}
.side nav ul{display:flex;overflow-x:auto}
.side a{display:flex;align-items:center;gap:var(--s-2);min-height:52px;padding:0 var(--s-4);font:700 var(--fs-sm)/1 var(--f-body);text-transform:uppercase;letter-spacing:.07em;text-decoration:none;white-space:nowrap}
.side a:hover{background:var(--ground-3)}
.side a[aria-current="page"]{background:var(--signal);color:var(--on-signal)}
.side a:focus-visible{outline-offset:-5px}
.side .grp-l{display:none}
.side .sp{display:none}
.panel{padding:var(--s-6) var(--gutter) var(--s-8);min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s-4);flex-wrap:wrap;border-bottom:6px solid var(--bone);padding-bottom:var(--s-3);margin-bottom:var(--s-5)}
.ph h1{font:900 var(--fs-h1)/.9 var(--f-display);text-transform:uppercase}
.ph p{font:400 var(--fs-sm)/1.3 var(--f-mono);color:var(--bone-dim)}
@media (min-width:900px){
  .dash{grid-template-columns:248px minmax(0,1fr)}
  .side{border-bottom:0;border-right:2px solid var(--bone);position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));align-self:start;padding:var(--s-5) 0;display:flex;flex-direction:column}
  .side-who{display:block;padding:0 var(--s-4) var(--s-5);font:400 var(--fs-sm)/1.4 var(--f-mono);color:var(--bone-dim)}
  .side-who b{display:block;color:var(--bone);font:900 1.6rem/1 var(--f-display);text-transform:uppercase;margin-bottom:2px}
  .side nav{flex:1;display:flex;flex-direction:column}
  .side nav ul{flex-direction:column;overflow:visible}
  .side a{min-height:48px}
  .side .grp-l{display:block;padding:var(--s-4) var(--s-4) var(--s-2);font:700 var(--fs-label)/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim);border-top:1px solid var(--rule);margin-top:var(--s-3)}
  .side .sp{display:block;flex:1}
  .panel{padding-top:var(--s-7)}
}
/* favourites: tray of tickets */
.filters{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-bottom:var(--s-5)}
.filters button{min-height:44px;padding:0 var(--s-5) 0 var(--s-4);border:0;background:var(--ground-3);color:var(--bone);font:900 1.3rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 100%,0 100%);display:inline-flex;align-items:center;gap:var(--s-2)}
.filters button span{font:700 var(--fs-sm)/1 var(--f-mono)}
.filters button[aria-pressed="true"]{background:var(--signal);color:var(--on-signal)}
.filters button:focus-visible{outline-offset:-6px}
.tray{display:grid;gap:var(--s-4);grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.ticket{--stub:88px;--nr:10px;display:grid;grid-template-columns:1fr var(--stub);background:var(--ground-2);position:relative;
  -webkit-mask:radial-gradient(circle var(--nr) at calc(100% - var(--stub)) 0,#0000 97%,#000),radial-gradient(circle var(--nr) at calc(100% - var(--stub)) 100%,#0000 97%,#000);-webkit-mask-composite:source-in;
  mask:radial-gradient(circle var(--nr) at calc(100% - var(--stub)) 0,#0000 97%,#000),radial-gradient(circle var(--nr) at calc(100% - var(--stub)) 100%,#0000 97%,#000);mask-composite:intersect}
.ticket-main{display:grid;grid-template-columns:76px 1fr;gap:var(--s-4);padding:var(--s-3);min-width:0}
.ticket-main h3{font:900 1.65rem/.95 var(--f-display);text-transform:uppercase;text-wrap:balance}
.ticket-main h3 a{text-decoration:none}.ticket-main h3 a:hover{text-decoration:underline}
.ticket-main .meta{font:400 var(--fs-sm)/1.4 var(--f-mono);color:var(--bone-dim);margin-top:var(--s-2)}
.ticket-main .added{font:400 var(--fs-label)/1.4 var(--f-mono);color:var(--bone-dim);margin-top:var(--s-3)}
.stub{position:relative;background:var(--signal);color:var(--on-signal);display:grid}
.stub::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:2px;background:repeating-linear-gradient(to bottom,var(--ground-2) 0 6px,transparent 6px 12px)}
.stub button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:700 var(--fs-label)/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;min-height:96px;color:var(--on-signal)}
.stub button:hover{background:var(--signal-hot)}
.stub button:focus-visible{outline:3px solid var(--ground);outline-offset:-6px}
.stub .ic{width:24px;height:24px}
.empty{display:grid;gap:var(--s-5);background:var(--bone);color:var(--ground);padding:var(--s-6) var(--s-5);align-items:center}
.empty h2{font:900 var(--fs-d1)/.86 var(--f-display);text-transform:uppercase;text-wrap:balance}
.empty p{max-width:52ch;color:var(--ink-2);font-size:var(--fs-lead)}
.empty .dial{width:min(220px,50vw);justify-self:start;color:var(--signal)}
@media (min-width:760px){.empty{grid-template-columns:1fr auto;padding:var(--s-7)}.empty .dial{width:240px;justify-self:end}}
/* account / forms */
.block{border-top:2px solid var(--bone);padding:var(--s-5) 0 var(--s-7);display:grid;gap:var(--s-5)}
.block h2{font:900 var(--fs-h2)/1 var(--f-display);text-transform:uppercase}
.block .lead{color:var(--bone-dim);max-width:52ch}
form.f{display:grid;gap:var(--s-4);max-width:520px}
.field label{display:block;font:700 var(--fs-label)/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.inp{position:relative}
.inp input,.sel{width:100%;min-height:50px;padding:0 var(--s-4);background:var(--ground-2);border:2px solid var(--rule);border-radius:0;color:var(--bone);font-size:var(--fs-body)}
.inp input:focus,.sel:focus{outline:none;border-color:var(--bone);box-shadow:0 0 0 3px var(--ground),0 0 0 5px var(--bone)}
.inp input::placeholder{color:var(--bone-dim);opacity:1}
.inp input[aria-invalid="true"]{border-color:var(--signal);background:var(--ground)}
.inp:has(.eye) input{padding-right:56px}
.eye{position:absolute;right:0;top:0;width:50px;height:50px;border:0;background:none;display:grid;place-items:center;color:var(--bone-dim)}
.eye:hover{color:var(--bone)}
.hint{font-size:var(--fs-sm);color:var(--bone-dim);margin-top:6px}
.err{display:flex;gap:8px;align-items:flex-start;margin-top:6px;font-size:var(--fs-sm);font-weight:600;color:var(--signal)}
.err .ic{width:18px;height:18px;margin-top:1px}
.alert{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-4);background:var(--signal);color:var(--on-signal);font-weight:600;max-width:520px}
.alert .ic{margin-top:2px}
.alert a{font-weight:700}
.note-ok{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-4);background:var(--bone);color:var(--ground);font-weight:600;max-width:520px}
.checks{display:flex;gap:var(--s-2) var(--s-4);flex-wrap:wrap;font:400 var(--fs-sm)/1.3 var(--f-mono);color:var(--bone-dim);margin-top:6px}
.checks span.ok{color:var(--bone)}.checks span.ok::before{content:"\2713 "}
.checks span::before{content:"\00b7 "}
.confirm{display:grid;gap:var(--s-4);padding:var(--s-5);border:3px solid var(--signal);max-width:520px}
.confirm h3{font:900 1.8rem/1 var(--f-display);text-transform:uppercase;color:var(--signal)}
.row-btns{display:flex;gap:var(--s-3);flex-wrap:wrap}
/* admin: ledger */
.tools{display:flex;gap:var(--s-4);flex-wrap:wrap;align-items:flex-end;margin-bottom:var(--s-4)}
.tools .field{flex:1;min-width:min(100%,260px);max-width:420px}
.tools .count{font:700 var(--fs-sm)/1 var(--f-mono);color:var(--bone-dim);padding-bottom:16px}
.ledger{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ledger thead th{background:var(--bone);color:var(--ground);font:700 var(--fs-label)/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:var(--s-3) var(--s-3)}
.ledger td{padding:var(--s-3);border-bottom:1px solid var(--rule);vertical-align:middle}
.ledger tbody tr:hover{background:var(--ground-2)}
.who{display:flex;align-items:center;gap:var(--s-3);min-width:0}
.who .av{flex:none;width:40px;height:40px;background:var(--bone);color:var(--ground);display:grid;place-items:center;font:900 1.2rem/1 var(--f-display)}
.who b{display:block;font-weight:700;line-height:1.2}
.who small{display:block;font:400 var(--fs-sm)/1.3 var(--f-mono);color:var(--bone-dim);overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font:700 var(--fs-label)/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;box-shadow:inset 0 0 0 2px var(--bone-dim)}
.chip::before{content:"";width:8px;height:8px;background:currentColor;border-radius:50%}
.ledger td>.chip{justify-self:start}
.chip--blocked{background:var(--signal);color:var(--on-signal);box-shadow:none}
.chip--blocked::before{border-radius:0;transform:rotate(45deg)}
.chip--unverified{box-shadow:none;border:2px dashed var(--bone-dim);padding:2px 8px}
.chip--unverified::before{background:none;border:2px solid currentColor}
.sel{min-height:44px;width:auto;min-width:112px;padding:0 var(--s-3);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--bone) 50%),linear-gradient(135deg,var(--bone) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
.sel[disabled]{opacity:1;color:var(--bone-dim);background-image:none;padding-right:var(--s-3)}
.acts-cell{display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center}
.sure{display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center;font-weight:600;color:var(--signal)}
.empty-row{padding:var(--s-6) var(--s-3);border-bottom:1px solid var(--rule)}
@media (max-width:779px){
  .ledger,.ledger tbody,.ledger tr,.ledger td{display:block}
  .ledger thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .ledger tr{border-top:4px solid var(--bone);padding:var(--s-3) 0 var(--s-4)}
  .ledger td{border:0;padding:var(--s-2) 0;display:grid;grid-template-columns:84px 1fr;gap:var(--s-3);align-items:center}
  .ledger td::before{content:attr(data-label);font:700 var(--fs-label)/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--bone-dim)}
  .ledger td.c-who{display:block}.ledger td.c-who::before{display:none}
  .ledger tbody tr:hover{background:none}
}
@media (min-width:780px){.ledger td.c-act{white-space:nowrap}.acts-cell{flex-wrap:nowrap}}
/* admin overview */
.stats{display:grid;gap:var(--s-4);margin-bottom:var(--s-7)}
.stat{padding:var(--s-5);display:flex;flex-direction:column;justify-content:space-between;min-height:220px;gap:var(--s-5)}
.stat--a{background:var(--signal);color:var(--on-signal)}.stat--b{background:var(--bone);color:var(--ground)}
.stat .v{font:900 var(--fs-stat)/.8 var(--f-display);font-variant-numeric:tabular-nums}
.stat h2{font:900 1.7rem/1 var(--f-display);text-transform:uppercase}
.stat p{font:400 var(--fs-sm)/1.3 var(--f-mono)}
.stat--b p{color:var(--ink-2)}
.recent li{display:grid;grid-template-columns:1fr auto;gap:var(--s-2) var(--s-4);align-items:center;padding:var(--s-3) 0;border-bottom:1px solid var(--rule)}
.recent .when{font:400 var(--fs-sm)/1.2 var(--f-mono);color:var(--bone-dim);text-align:right}
@media (min-width:700px){.stats{grid-template-columns:1fr 1fr}.stat{min-height:280px}}

/* ---------- auth: one-sheet ---------- */
.auth{display:grid;min-height:calc(100vh - var(--nav-h) - 40px)}
.auth-sheet{position:relative;background:var(--signal);color:var(--on-signal);padding:var(--s-6) var(--gutter) var(--s-7);overflow:hidden;display:flex;flex-direction:column;gap:var(--s-4)}
.auth-sheet h1{font:900 var(--fs-d1)/.86 var(--f-display);text-transform:uppercase;text-wrap:balance;position:relative}
.auth-sheet p{font:700 var(--fs-body)/1.5 var(--f-mono);max-width:34ch;position:relative}
.auth-sheet .dial{position:absolute;right:-70px;bottom:-70px;width:300px;color:var(--on-signal);opacity:1}
.auth-sheet::after{content:"";position:absolute;left:0;right:0;bottom:0;height:20px;background:radial-gradient(circle 10px at 10px 100%,var(--ground) 97%,transparent) 0 0/20px 20px repeat-x}
.auth-form{padding:var(--s-6) var(--gutter) var(--s-8);display:flex;flex-direction:column;gap:var(--s-5);justify-content:center}
.auth-form h2{font:900 var(--fs-h2)/1 var(--f-display);text-transform:uppercase}
.auth-form .alt{display:flex;gap:var(--s-4);flex-wrap:wrap;font-size:var(--fs-sm)}
.auth-form .alt a{display:inline-flex;align-items:center;min-height:44px;font-weight:600}
.auth-form form.f{max-width:440px}
.big-addr{font:700 1.15rem/1.3 var(--f-mono);background:var(--bone);color:var(--ground);padding:var(--s-3) var(--s-4);display:inline-block;overflow-wrap:anywhere;max-width:100%}
.steps{counter-reset:s;display:grid;gap:var(--s-3);max-width:440px}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.2rem 1fr;gap:var(--s-3);align-items:baseline}
.steps li::before{content:counter(s);font:900 1.8rem/1 var(--f-display);color:var(--signal)}
@media (min-width:900px){
  .auth{grid-template-columns:1.1fr 1fr}
  .auth-sheet{padding-block:var(--s-8);justify-content:flex-end}
  .auth-sheet .dial{width:520px;right:-140px;top:-110px;bottom:auto}
  .auth-sheet::after{left:auto;right:0;top:0;bottom:0;width:20px;height:auto;background:radial-gradient(circle 10px at 100% 10px,var(--ground) 97%,transparent) 0 0/20px 20px repeat-y}
  .auth-form{padding:var(--s-8) clamp(32px,6vw,96px)}
}

/* ---------- footer: end card ---------- */
.foot{background:var(--bone);color:var(--ground);margin-top:auto}
.foot-in{display:grid;gap:var(--s-5);padding-block:var(--s-7) var(--s-6)}
.foot-word{font:900 clamp(3.5rem,15vw,6rem)/.82 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.foot nav ul{display:flex;gap:var(--s-2) var(--s-5);flex-wrap:wrap}
.foot nav a{display:inline-flex;align-items:center;min-height:44px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:var(--fs-sm)}
.foot small{display:block;font:400 var(--fs-sm)/1.5 var(--f-mono);color:var(--ink-2);max-width:78ch}
.foot small+small{margin-top:var(--s-2)}
.foot a:focus-visible{outline-color:var(--ground)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;background:var(--bone);color:var(--ground);padding:0 var(--s-4);min-height:48px;display:flex;align-items:center;gap:var(--s-4);font-weight:600;font-size:var(--fs-sm);max-width:min(92vw,560px);box-shadow:0 14px 28px -8px rgba(0,0,0,.6);clip-path:inset(0 0 0 0)}
.toast[hidden]{display:none}
.toast.in{animation:wipeX 300ms var(--ease-out) backwards}
.toast button{background:none;border:0;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;min-height:44px;padding:0 var(--s-2);color:var(--ground)}
.toast button:focus-visible{outline-color:var(--ground)}
@media (min-width:760px){.slate div{border-bottom:0}}
</style>
</head>

const LOGO=`<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--signal)"/><circle cx="16" cy="16" r="9.5" fill="var(--ground)"/><path d="M16 16L24 8" stroke="var(--bone)" stroke-width="3" stroke-linecap="square"/><circle cx="16" cy="16" r="2.6" fill="var(--signal)"/><path d="M16 2v3M16 27v3M2 16h3M27 16h3" stroke="var(--ground)" stroke-width="2.4"/></svg>`;
const NAVL=[['Home','/'],['TV Shows','/tv'],['Movies','/movies'],['New & Popular','/new'],['My List','/favorites']];
function renderNav(){const cur=path(),r=state.role,m=me();
  const links=NAVL.map(([l,h])=>{const on=h===cur||(h==='/favorites'&&(cur==='/favorites'||cur==='/favorites-empty'));return `<a href="#${h}" ${on?'aria-current="page"':''} ${['/tv','/movies','/new'].includes(h)?`data-action="stub" data-msg="${l} listing is outside this mockup."`:''}>${l}</a>`}).join('');
  const target=r==='admin'?'#/admin/overview':'#/favorites';
  const end=r==='visitor'?`<div class="nav-auth"><a class="btn btn--flat btn--line" href="#/login">Log in</a><a class="btn btn--flat btn--signal" href="#/register">Register</a></div>`
   :`<a class="me" href="${target}" aria-label="${r==='admin'?'Admin dashboard':'My Vault'}, signed in as ${m.name}"><span class="nm">${m.name}<small>${r==='admin'?'Administrator':'My Vault'}</small></span><span class="av" aria-hidden="true">${m.ini}</span></a>`;
  const srch=`<form class="search" role="search" data-action="search">${ic('search')}<label class="vh" for="q-${state.menu?'m':'d'}">Search movies and shows</label><input id="q-${state.menu?'m':'d'}" type="search" placeholder="Search movies, shows..." autocomplete="off"></form>`;
  $('#nav').innerHTML=`<div class="nav-in"><a class="brand" href="#/" aria-label="Cinevault home">${LOGO}<span>Cinevault</span></a>
   <nav aria-label="Primary" class="nav-links">${links}</nav>
   <div class="nav-end">${srch}${end}<button class="menu-btn" type="button" data-action="menu" aria-expanded="${state.menu}" aria-controls="menu" aria-label="${state.menu?'Close menu':'Open menu'}">${ic(state.menu?'close':'menu')}</button></div>
   ${state.menu?`<div class="menu on-signal" id="menu">${srch.replace('class="search"','class="search"')}${NAVL.map(([l,h])=>`<a class="big" href="#${h}" ${h===cur?'aria-current="page"':''} ${['/tv','/movies','/new'].includes(h)?`data-action="stub" data-msg="${l} listing is outside this mockup."`:''}>${l}${ic('arrow')}</a>`).join('')}
     <div class="msub">${r==='visitor'?`<a class="btn btn--ink" href="#/login">Log in</a><a class="btn btn--bone" href="#/register">Register</a>`:`<a class="btn btn--ink" href="${target}">${r==='admin'?'Admin dashboard':'My Vault'}</a><button class="btn btn--bone" type="button" data-action="logout">Log out</button>`}</div></div>`:''}</div>`;}

/* =========================================================
   SCREENS
   ========================================================= */
const listBtn=(t,cls,icon)=>`<button type="button" class="btn ${cls}" data-action="list" data-id="${t.id}" aria-pressed="${state.favs.has(t.id)}">${ic(state.favs.has(t.id)?'check':'plus')}<span class="lbl">${state.favs.has(t.id)?'In My List':'Add to My List'}</span></button>`;
const metaLine=t=>`<b>${typeLabel(t)}</b> · ${t.rel||t.y}${t.r?` · ${t.r.toFixed(1)}/10`:''}`;

/* ---- HOME: the program ---- */
function previewHTML(t){const n=numOf(t.id);return `<div class="pv-back">${backSVG(t)}</div>
 <div class="pv-mid"><a href="#/title/${t.id}" tabindex="-1" aria-hidden="true">${poster(t)}</a><div class="pv-head"><span class="pv-num" data-pvnum>${pad2(n)}</span><h2 class="pv-title">${esc(t.n)}</h2></div></div>
 <p class="pv-meta">${typeLabel(t)} · ${t.rel||t.y} · ${t.len}${t.r?` · ${t.r.toFixed(1)}/10`:''} · ${t.g.join(' / ')}</p>
 <p class="pv-syn">${esc(t.o)}</p>
 <div class="pv-acts"><a class="btn btn--ink" href="#/title/${t.id}">Details ${ic('arrow')}</a>${listBtn(t,'btn--bone')}</div>`}
function home(){
  const rows=GROUPS.map(([name,sub,ids])=>`<div class="grp"><h2>${name}</h2><p>${sub}</p></div><ul>${ids.map(i=>{const t=TITLES[i],n=numOf(t.id);
   return `<li class="row" data-id="${t.id}"><a class="row-link" href="#/title/${t.id}"><span class="row-num">${pad2(n)}</span><span class="row-title">${esc(t.n)}</span><span class="row-meta">${metaLine(t)}<br>${t.len}</span></a>
   <button type="button" class="row-add" data-action="list" data-id="${t.id}" aria-pressed="${state.favs.has(t.id)}" aria-label="Add ${esc(t.n)} to My List">${ic(state.favs.has(t.id)?'check':'plus')}</button>
   <div class="row-card"><p class="syn">${esc(t.o)}</p><a href="#/title/${t.id}" tabindex="-1" aria-hidden="true">${poster(t)}</a>
    <div class="acts"><a class="btn btn--signal" href="#/title/${t.id}">Details ${ic('arrow')}</a>${listBtn(t,'btn--bone')}</div></div></li>`}).join('')}</ul>`).join('');
  const gen=['Sci-Fi','Action','Drama','Fantasy','Thriller','Comedy','Horror','Animation','Documentary','Romance','Mystery','Crime'];
  const cuts=gen.map(g=>`<a class="cut" href="#/" data-action="stub" data-msg="${g} genre page is outside this mockup.">${g}</a>`).join('');
  const cutsDup=gen.map(g=>`<a class="cut" href="#/" aria-hidden="true" tabindex="-1">${g}</a>`).join('');
  const tk=`<div class="ticker" id="ticker"><button class="ticker-btn" type="button" data-action="ticker" aria-pressed="false" aria-label="Pause genre ticker">${ic('pause')}</button>
   <div class="ticker-view" role="region" aria-label="Browse by genre"><div class="ticker-track">${cuts}${cutsDup}</div></div></div>`;
  return `<div class="program"><div class="index">${tk}${rows}</div><aside class="pv" id="pv" aria-label="Title preview"><div class="pv-body"></div></aside></div>`}
function showPreview(id,first){if(state.pv===id&&!first)return;const t=T(id),pv=$('#pv');if(!pv||getComputedStyle(pv).display==='none'&&!first)return;
  const old=state.pvn;state.pv=id;$$('.row').forEach(r=>r.classList.toggle('is-active',r.dataset.id===id));
  const b=$('.pv-body',pv);b.innerHTML=previewHTML(t);b.classList.remove('wipe');void b.offsetWidth;if(!first)b.classList.add('wipe');
  const n=numOf(id);state.pvn=n;const el=$('[data-pvnum]',b);if(el){el.dataset.v=n;if(!first)tick(el,n,{from:old})}syncList()}

/* ---- TITLE: the one-sheet ---- */
function titlePage(id){const t=T(id)||TITLES[0],series=t.type==='series';
  const more=TITLES.filter(x=>x.id!==t.id).map(x=>({x,s:x.g.filter(g=>t.g.includes(g)).length+(x.type===t.type?.5:0)})).sort((a,b)=>b.s-a.s).slice(0,6).map(o=>o.x);
  const credits=`<dl class="credits"><dt>Starring</dt><dd><ul>${t.cast.map(c=>`<li>${c[0]}<small>as ${c[1]}</small></li>`).join('')}</ul></dd>
   <dt>${series?'Created by':'Directed by'}</dt><dd>${t.dir}</dd><dt>Language</dt><dd class="plain">${t.lang}</dd><dt>Status</dt><dd class="plain">${t.status}</dd></dl>`;
  let eps='';if(series){eps=`<section class="sec full" aria-labelledby="eph"><h2 id="eph">Seasons &amp; episodes</h2><div class="seasons" role="group" aria-label="Season">${Array.from({length:t.seasons},(_,i)=>`<button type="button" data-action="season" data-s="${i+1}" aria-pressed="${i+1===state.season}">Season ${i+1}</button>`).join('')}</div><ol class="eps" id="eps">${epList(t,state.season)}</ol></section>`}
  return `<article class="sheet ${series?'sheet--bone on-bone':'on-signal'}">
   <div class="sheet-field"><div class="wrap sheet-grid">
    <div><h1 class="sheet-title">${esc(t.n)}</h1>
     <p class="sheet-sub mono">${t.rel||t.y} · ${typeLabel(t)}</p>
     <ul class="tags" aria-label="Genres">${t.g.map(g=>`<li>${g}</li>`).join('')}</ul>
     <dl class="slate"><div><dt>Type</dt><dd>${typeLabel(t)}</dd></div><div><dt>${series?'Seasons':'Runtime'}</dt><dd>${t.len}</dd></div><div><dt>Rating</dt><dd>${t.r?`${ic('star')}${t.r.toFixed(1)}<small>/10</small>`:'<small>Unrated</small>'}</dd></div><div><dt>${t.rel?'Opens':'Year'}</dt><dd>${t.rel?t.rel.replace(/^\w+ /,''):t.y}</dd></div></dl>
     <div class="stubs"><button type="button" class="btn btn--a" data-action="trailer">${ic('play')}Watch trailer</button>${listBtn(t,'btn--b')}
      <span class="dl"><button type="button" class="btn btn--dash" data-action="download">${ic('download')}Download</button><span class="flag">dev flag</span></span></div>
    </div>
    <div class="cutouts" aria-hidden="true"><div class="back">${backSVG(t)}</div>${poster(t)}</div>
   </div></div>
   <div class="wrap sheet-body">
    <section class="sec story" aria-labelledby="sh"><h2 id="sh">The story</h2><p>${esc(t.o)}</p></section>
    <section class="sec" aria-labelledby="ch"><h2 id="ch">Credits</h2>${credits}</section>
    ${eps}
    <section class="sec more full" aria-labelledby="mh"><h2 id="mh">More like this</h2><div class="rail">${more.map(x=>`<a href="#/title/${x.id}">${poster(x)}<span class="cap">${esc(x.n)}<small>${typeLabel(x)} · ${x.rel||x.y}</small></span></a>`).join('')}</div></section>
   </div></article>`}
function epList(t,s){const n=s===1?8:6;return Array.from({length:n},(_,i)=>`<li><span class="e">S${s}E${pad2(i+1)}</span><span class="n">${esc(EPS[(t.idx*5+s*3+i)%EPS.length])}</span><span class="d">${40+((t.idx+s+i)*7)%22} min</span></li>`).join('')}

/* ---- DASHBOARD shell ---- */
function dash(active,title,sub,inner){const r=state.role,m=me(),L=(h,l,i)=>`<li><a href="#${h}" ${active===h?'aria-current="page"':''}>${ic(i)}${l}</a></li>`;
  return `<div class="dash"><aside class="side"><div class="side-who"><b>${m.name}</b>${r==='admin'?'Administrator':'Member'}</div><nav aria-label="Dashboard"><ul>
   ${L('/favorites','Favorites','vault')}${L('/account','Account','user')}
   ${r==='admin'?`<li class="grp-l" aria-hidden="true">Admin</li>${L('/admin/users','Users','ledger')}${L('/admin/overview','Overview','sheet')}`:''}
   </ul><div class="sp"></div><ul>${`<li class="grp-l" aria-hidden="true">Elsewhere</li>`}<li><a href="#/">${ic('back')}Back to site</a></li><li><a href="#/" data-action="logout">${ic('out')}Log out</a></li></ul></nav></aside>
   <section class="panel"><div class="ph"><h1>${title}</h1><p>${sub}</p></div>${inner}</section></div>`}

/* ---- FAVORITES ---- */
function ticket(t){return `<li class="ticket" data-id="${t.id}"><div class="ticket-main"><a href="#/title/${t.id}" tabindex="-1" aria-hidden="true">${poster(t)}</a><div><h3><a href="#/title/${t.id}">${esc(t.n)}</a></h3><p class="meta">${typeLabel(t)} · ${t.y}${t.r?` · ${t.r.toFixed(1)}/10`:''}</p><p class="added">${t.g.join(' / ')}</p></div></div>
 <div class="stub"><button type="button" data-action="unfav" data-id="${t.id}" aria-label="Remove ${esc(t.n)} from My List">${ic('trash')}Remove</button></div></li>`}
function favorites(forceEmpty){const all=forceEmpty?[]:[...state.favs].map(T),mv=all.filter(t=>t.type==='movie'),sr=all.filter(t=>t.type==='series');
  const list=state.filter==='movies'?mv:state.filter==='series'?sr:all;
  let body;
  if(!all.length)body=`<div class="empty on-bone"><div><h2>The vault is empty</h2><p style="margin-top:var(--s-4)">Titles you add to My List are kept here, ready for the next free evening. Find something on the program and add it.</p><div class="row-btns" style="margin-top:var(--s-5)"><a class="btn btn--signal" href="#/">Browse the program ${ic('arrow')}</a></div></div>${dialSVG('dial')}</div>`;
  else if(!list.length)body=`<div class="empty on-bone"><div><h2>No ${state.filter==='movies'?'movies':'series'} in the vault</h2><p style="margin-top:var(--s-4)">Nothing here under this filter. Switch back to All to see the rest.</p><div class="row-btns" style="margin-top:var(--s-5)"><button class="btn btn--ink" type="button" data-action="filter" data-f="all">Show all ${all.length}</button></div></div>${dialSVG('dial')}</div>`;
  else body=`<ul class="tray" aria-label="Favorites">${list.map(ticket).join('')}</ul>`;
  const F=(k,l,c)=>`<button type="button" data-action="filter" data-f="${k}" aria-pressed="${state.filter===k}">${l}<span>${pad2(c)}</span></button>`;
  return dash('/favorites','My Vault',`${all.length} saved title${all.length===1?'':'s'}`,`<div class="filters" role="group" aria-label="Filter favorites">${F('all','All',all.length)}${F('movies','Movies',mv.length)}${F('series','Series',sr.length)}</div>${body}`)}
function dialSVG(c=''){return `<svg class="${c}" viewBox="0 0 200 200" aria-hidden="true" focusable="false"><circle cx="100" cy="100" r="94" fill="currentColor"/><circle cx="100" cy="100" r="64" fill="var(--bone)"/><circle cx="100" cy="100" r="64" fill="none" stroke="var(--ground)" stroke-width="6"/>${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6;return `<line x1="${f1(100+72*Math.cos(a))}" y1="${f1(100+72*Math.sin(a))}" x2="${f1(100+88*Math.cos(a))}" y2="${f1(100+88*Math.sin(a))}" stroke="var(--ground)" stroke-width="5"/>`}).join('')}<path d="M100 100L140 60" stroke="var(--ground)" stroke-width="12"/><circle cx="100" cy="100" r="12" fill="currentColor"/></svg>`}

/* ---- ACCOUNT ---- */
const fld=(id,label,type,o={})=>`<div class="field" data-field="${id}"><label for="${id}">${label}</label><div class="inp"><input id="${id}" name="${id}" type="${type}" ${o.ac?`autocomplete="${o.ac}"`:''} ${o.val?`value="${esc(o.val)}"`:''} ${o.ph?`placeholder="${o.ph}"`:''} aria-describedby="${id}-h ${id}-e">${type==='password'?`<button type="button" class="eye" data-action="peek" aria-label="Show password" aria-pressed="false">${ic('eye')}</button>`:''}</div><p class="hint" id="${id}-h" ${o.hint?'':'hidden'}>${o.hint||''}</p><p class="err" id="${id}-e" hidden></p></div>`;
function account(){const m=me();
  return dash('/account','Account',`Signed in as ${esc(m.email)}`,`
  <section class="block" aria-labelledby="a1"><h2 id="a1">Profile</h2><form class="f" data-form="profile" novalidate>
    ${fld('acc-name','Name','text',{val:m.name,ac:'name'})}${fld('acc-email','Email','email',{val:m.email,ac:'email',hint:'Changing your email sends a verification link to the new address. The old one stays active until you confirm.'})}
    <div class="row-btns"><button class="btn btn--signal" type="submit">Save changes</button></div><div id="profile-msg" aria-live="polite"></div></form></section>
  <section class="block" aria-labelledby="a2"><h2 id="a2">Change password</h2><form class="f" data-form="password" novalidate>
    ${fld('pw-old','Current password','password',{ac:'current-password'})}${fld('pw-new','New password','password',{ac:'new-password',hint:'At least 8 characters, with a letter and a number.'})}${fld('pw-confirm','Confirm new password','password',{ac:'new-password'})}
    <div class="row-btns"><button class="btn btn--signal" type="submit">Update password</button></div><div id="password-msg" aria-live="polite"></div></form></section>
  <section class="block" aria-labelledby="a3"><h2 id="a3">Delete account</h2><p class="lead">Removes your account and your ${state.favs.size} favorites. This cannot be undone.</p>
    <div id="del-zone"><button class="btn btn--danger btn--flat" type="button" data-action="del-open">Delete my account...</button></div></section>`)}

/* ---- ADMIN ---- */
function userRows(){const q=state.uq.trim().toLowerCase(),list=state.users.filter(u=>!q||u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q)),self=me().name;
  const chip=u=>u.blocked?`<span class="chip chip--blocked">Blocked</span>`:u.verified?`<span class="chip">Active</span>`:`<span class="chip chip--unverified">Unverified</span>`;
  const rows=list.map(u=>{const isMe=u.name===self,del=state.delId===u.id;
    return `<tr role="row" data-uid="${u.id}"><td role="cell" class="c-who"><div class="who"><span class="av" aria-hidden="true">${initials(u.name)}</span><div><b>${esc(u.name)}${isMe?' (you)':''}</b><small>${esc(u.email)}</small></div></div></td>
    <td role="cell" data-label="Role"><label class="vh" for="role-${u.id}">Role for ${esc(u.name)}</label><select class="sel" id="role-${u.id}" data-action="role-sel" data-uid="${u.id}" ${isMe?'disabled title="You cannot change your own role"':''}><option value="user" ${u.role==='user'?'selected':''}>User</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></td>
    <td role="cell" data-label="Status">${chip(u)}</td><td role="cell" data-label="Joined">${fmtD(u.joined)}</td>
    <td role="cell" class="c-act" data-label="Actions">${del?`<div class="sure" role="alert"><span>Delete ${esc(u.name)}?</span><button type="button" class="btn btn--flat btn--danger" style="background:var(--signal);color:var(--on-signal)" data-action="del-yes" data-uid="${u.id}">Delete</button><button type="button" class="btn btn--flat btn--line" data-action="del-no" data-uid="${u.id}">Keep</button></div>`
     :`<div class="acts-cell">${u.blocked?`<button type="button" class="btn btn--flat btn--bone" data-action="block" data-uid="${u.id}">Unblock</button>`:`<button type="button" class="btn btn--flat btn--line" data-action="block" data-uid="${u.id}" ${isMe?'disabled':''}>Block</button>`}<button type="button" class="btn btn--flat btn--danger" data-action="del-ask" data-uid="${u.id}" ${isMe?'disabled':''} aria-label="Delete ${esc(u.name)}">${ic('trash')}Delete</button></div>`}</td></tr>`}).join('');
  return {html:rows||`<tr role="row"><td role="cell" colspan="5" class="empty-row">No users match "${esc(state.uq)}". Check the spelling or clear the search.</td></tr>`,n:list.length}}
function adminUsers(){const u=userRows();
  return dash('/admin/users','Users',`${state.users.length} registered`,`<div class="tools"><div class="field"><label for="uq">Search name or email</label><div class="inp"><input id="uq" type="search" value="${esc(state.uq)}" placeholder="e.g. hana or example.com" autocomplete="off" data-action="usearch"></div></div><p class="count" id="ucount" aria-live="polite">Showing ${u.n} of ${state.users.length}</p></div>
   <table class="ledger" role="table" aria-label="Users"><thead role="rowgroup"><tr role="row"><th role="columnheader" scope="col">User</th><th role="columnheader" scope="col">Role</th><th role="columnheader" scope="col">Status</th><th role="columnheader" scope="col">Joined</th><th role="columnheader" scope="col">Actions</th></tr></thead><tbody role="rowgroup" id="ubody">${u.html}</tbody></table>`)}
function adminOverview(){const tot=state.users.length,nw=state.users.filter(isNew).length,rec=[...state.users].sort((a,b)=>b.joined-a.joined).slice(0,6);
  return dash('/admin/overview','Overview','As of '+fmtD(NOW),`<div class="stats"><section class="stat stat--a" aria-labelledby="s1"><h2 id="s1">Total users</h2><div class="v" data-count="${tot}" aria-label="${tot}">${pad2(tot)}</div><p>All registered accounts, verified or not.</p></section>
   <section class="stat stat--b" aria-labelledby="s2"><h2 id="s2">New this week</h2><div class="v" data-count="${nw}" aria-label="${nw}">${pad2(nw)}</div><p>Joined in the last 7 days.</p></section></div>
   <section aria-labelledby="rs" class="sec"><h2 id="rs" class="disp" style="font-size:var(--fs-h2);border-bottom:6px solid var(--bone);padding-bottom:var(--s-2);margin-bottom:var(--s-3)">Recent sign-ups</h2><ul class="recent">${rec.map(u=>`<li><div class="who"><span class="av" aria-hidden="true">${initials(u.name)}</span><div><b>${esc(u.name)}</b><small>${esc(u.email)}</small></div></div><div class="when">${fmtD(u.joined)}<br>${u.blocked?'Blocked':u.verified?'Active':'Unverified'}</div></li>`).join('')}</ul>
   <div class="row-btns" style="margin-top:var(--s-5)"><a class="btn btn--bone" href="#/admin/users">Open the user ledger ${ic('arrow')}</a></div></section>`)}

/* ---- AUTH ---- */
function authShell(h1,line,formHTML){return `<section class="auth"><div class="auth-sheet on-signal"><h1>${h1}</h1><p>${line}</p>${dialSVG('dial')}</div><div class="auth-form">${formHTML}</div></section>`}
const login=()=>authShell('Admit one','Log in to open your vault and your My List.',`<h2>Log in</h2><div id="login-alert"></div><form class="f" data-form="login" novalidate>${fld('l-email','Email','email',{ac:'email',ph:'you@example.com'})}${fld('l-pass','Password','password',{ac:'current-password'})}<div class="row-btns"><button class="btn btn--signal" type="submit">Log in</button></div></form><div class="alt"><a href="#/forgot">Forgot your password?</a><a href="#/register">Create an account</a></div>`);
const register=()=>authShell('Get your ticket','One account, one vault. We verify your email before anything opens.',`<h2>Create account</h2><form class="f" data-form="register" novalidate>${fld('r-name','Name','text',{ac:'name'})}${fld('r-email','Email','email',{ac:'email',ph:'you@example.com'})}${fld('r-pass','Password','password',{ac:'new-password',hint:'At least 8 characters, with a letter and a number.'})}${fld('r-conf','Confirm password','password',{ac:'new-password'})}<div class="row-btns"><button class="btn btn--signal" type="submit">Create account</button></div></form><div class="alt"><a href="#/login">Already registered? Log in</a></div>`);
const forgot=()=>authShell('Lost your stub?','Tell us your email and we will send a link to set a new password.',`<h2>Reset password</h2><div id="forgot-box"><form class="f" data-form="forgot" novalidate>${fld('f-email','Email','email',{ac:'email',ph:'you@example.com'})}<div class="row-btns"><button class="btn btn--signal" type="submit">Send reset link</button></div></form></div><div class="alt"><a href="#/login">Back to log in</a></div>`);
const checkEmail=()=>authShell('Check your inbox','The door opens from the link we sent. Open it on this device.',`<h2>Verify your email</h2><p>We sent a verification link to</p><span class="big-addr" id="ce-addr">${esc(state.pendingEmail||'mara.okafor@example.com')}</span>
  <ol class="steps"><li>Open the email from Cinevault.</li><li>Press the verify link.</li><li>Log in and start your vault.</li></ol>
  <p class="hint">Nothing there? Check spam. Verification links expire, so request a new one if yours does not work.</p>
  <div class="row-btns"><button class="btn btn--bone" id="resend" type="button" data-action="resend" disabled>Resend email</button><span class="mono" id="cd" style="align-self:center;font-size:var(--fs-sm);color:var(--bone-dim)"></span></div><div class="alt"><a href="#/register">Wrong address? Start again</a><a href="#/login">Back to log in</a></div>`);

/* =========================================================
   ROUTER
   ========================================================= */
const ROUTES=[[/^\/$/,()=>home(),'Home'],[/^\/title\/([\w-]+)$/,id=>titlePage(id),'Title'],[/^\/favorites$/,()=>favorites(),'Favorites'],[/^\/favorites-empty$/,()=>favorites(true),'Favorites (empty)'],[/^\/account$/,()=>account(),'Account'],[/^\/admin\/users$/,()=>adminUsers(),'Admin Users'],[/^\/admin\/overview$/,()=>adminOverview(),'Admin Overview'],[/^\/login$/,()=>login(),'Log in'],[/^\/register$/,()=>register(),'Register'],[/^\/forgot$/,()=>forgot(),'Forgot password'],[/^\/check-email$/,()=>checkEmail(),'Check your email']];
let first=true,cdT;
function render(){const p=path();clearInterval(cdT);state.menu=false;
  if(p.startsWith('/admin/')&&state.role!=='admin')state.role='admin';
  else if((p==='/favorites'||p==='/account'||p==='/favorites-empty')&&state.role==='visitor')state.role='user';
  let html=null,title='Cinevault';for(const [re,fn,t] of ROUTES){const m=p.match(re);if(m){html=fn(m[1]);title=t;break}}
  if(html===null){html=home();title='Home'}
  if(p.startsWith('/title/'))state.season=1;
  if(!p.includes('favorites'))state.filter=state.filter;
  const main=$('#main');main.innerHTML=html;main.classList.remove('wipe');void main.offsetWidth;if(!reduce)main.classList.add('wipe');
  document.title=`${p.startsWith('/title/')?(T(p.split('/')[2])||{n:'Title'}).n:title} - Cinevault`;
  renderMock();renderNav();
  if(!first){window.scrollTo(0,0);main.focus({preventScroll:true})}first=false;
  if(p==='/'){state.pv=null;showPreview(ORDER.length?TITLES[ORDER[0]].id:'',true)}
  $$('[data-count]').forEach(el=>tick(el,+el.dataset.count,{from:0,steps:14,dur:700}));
  if(p==='/check-email')startCountdown(30);
  syncList()}
function startCountdown(s){const b=$('#resend'),c=$('#cd');if(!b)return;b.disabled=true;let left=s;const paint=()=>{c.textContent=left>0?`You can resend in ${left}s`:'';b.disabled=left>0};paint();clearInterval(cdT);cdT=setInterval(()=>{left--;paint();if(left<=0)clearInterval(cdT)},1000)}
addEventListener('hashchange',render);

/* sync every My List control */
function syncList(){$$('[data-action="list"]').forEach(b=>{const id=b.dataset.id,on=state.favs.has(id),t=T(id);b.setAttribute('aria-pressed',on);const u=$('use',b);if(u)u.setAttribute('href',on?'#i-check':'#i-plus');const l=$('.lbl',b);if(l)l.textContent=on?'In My List':'Add to My List';else b.setAttribute('aria-label',`${on?'Remove':'Add'} ${t.n} ${on?'from':'to'} My List`)})}

/* =========================================================
   FORMS + VALIDATION
   ========================================================= */
const V={req:m=>v=>v.trim()?'':m,
 email:v=>!v.trim()?'Enter your email address.':/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())?'':'That email looks incomplete. Check for a missing @ or domain, like name@example.com.',
 pw:v=>!v?'Enter a password.':(v.length>=8&&/[A-Za-z]/.test(v)&&/\d/.test(v))?'':'Use at least 8 characters, with a letter and a number.',
 same:(id,m)=>(v,f)=>v===f.elements[id].value?'':m};
const RULES={
 login:{'l-email':[V.email],'l-pass':[V.req('Enter your password.')]},
 register:{'r-name':[V.req('Enter your name.')],'r-email':[V.email],'r-pass':[V.pw],'r-conf':[V.req('Confirm your password.'),V.same('r-pass',"Passwords don't match. Retype the new password in both fields.")]},
 forgot:{'f-email':[V.email]},
 profile:{'acc-name':[V.req('Name cannot be empty.')],'acc-email':[V.email]},
 password:{'pw-old':[V.req('Enter your current password.')],'pw-new':[V.pw,(v,f)=>v&&v===f.elements['pw-old'].value?'New password must be different from the current one.':''],'pw-confirm':[V.req('Confirm your new password.'),V.same('pw-new',"Passwords don't match. Retype the new password in both fields.")]}};
function setErr(form,id,msg){const w=form.querySelector(`[data-field="${id}"]`),e=$('.err',w),i=$('input',w),h=$('.hint',w);e.hidden=!msg;e.innerHTML=msg?ic('alert')+'<span>'+esc(msg)+'</span>':'';if(msg)i.setAttribute('aria-invalid','true');else i.removeAttribute('aria-invalid');if(h&&msg&&h.textContent)h.hidden=true;else if(h&&h.textContent)h.hidden=false}
function checkForm(form,rules,only){let firstBad=null;for(const [id,fns] of Object.entries(rules)){if(only&&only!==id)continue;const el=form.elements[id];let msg='';for(const fn of fns){msg=fn(el.value,form);if(msg)break}setErr(form,id,msg);if(msg&&!firstBad)firstBad=el}if(firstBad&&!only)firstBad.focus();return !firstBad}
const alertBox=(msg,extra='')=>`<div class="alert" role="alert">${ic('alert')}<div>${msg}${extra}</div></div>`;
const HANDLERS={
 login(f){const em=f.elements['l-email'].value.trim().toLowerCase(),pw=f.elements['l-pass'].value,box=$('#login-alert');box.innerHTML='';
  if(em.startsWith('blocked')){box.innerHTML=alertBox('This account has been blocked by an administrator. Contact support if you think this is a mistake.');return}
  if(em.startsWith('unverified')){state.pendingEmail=em;box.innerHTML=alertBox('Verify your email first. We sent a link to '+esc(em)+'. ',' <a href="#/check-email">Send it again</a>');return}
  if(pw!=='vault1234'){box.innerHTML=alertBox('Email or password is incorrect. Check both and try again, or <a href="#/forgot">reset your password</a>.');return}
  state.role=em.startsWith('admin')?'admin':'user';location.hash=state.role==='admin'?'#/admin/overview':'#/favorites';toast('Logged in as '+me().name+'.')},
 register(f){const em=f.elements['r-email'].value.trim().toLowerCase();if(em==='taken@example.com'){setErr(f,'r-email','An account with this email already exists. Log in instead, or use another address.');f.elements['r-email'].focus();return}
  state.pendingEmail=em;location.hash='#/check-email'},
 forgot(f){const em=f.elements['f-email'].value.trim();$('#forgot-box').innerHTML=`<div class="note-ok" role="status">${ic('check')}<div>If an account exists for <b>${esc(em)}</b>, a reset link is on its way. Open it from the same device.</div></div><div class="row-btns" style="margin-top:var(--s-4)"><a class="btn btn--bone" href="#/login">Back to log in</a></div>`},
 profile(f){const em=f.elements['acc-email'].value.trim().toLowerCase(),changed=em!==me().email;$('#profile-msg').innerHTML=`<div class="note-ok" role="status">${ic('check')}<div>${changed?'Name saved. We sent a verification link to <b>'+esc(em)+'</b>. Your current email stays active until you confirm.':'Profile saved.'}</div></div>`},
 password(f){if(f.elements['pw-old'].value!=='vault1234'){setErr(f,'pw-old','Current password is incorrect. Try again, or log out and reset it by email.');f.elements['pw-old'].focus();return}
  f.reset();$$('.err',f).forEach(e=>e.hidden=true);$('#password-msg').innerHTML=`<div class="note-ok" role="status">${ic('check')}<div>Password updated. Use the new one next time you log in.</div></div>`}};
document.addEventListener('submit',e=>{const f=e.target.closest('form');if(!f)return;e.preventDefault();
  if(f.dataset.action==='search'||f.classList.contains('search')){const v=$('input',f).value.trim();toast(v?`Search for "${v}" opens a results page, outside this mockup.`:'Type a title to search.');return}
  const n=f.dataset.form;if(!n)return;if(checkForm(f,RULES[n]))HANDLERS[n](f)});
document.addEventListener('focusout',e=>{const i=e.target;if(!i.matches||!i.matches('.field input'))return;const f=i.closest('form[data-form]');if(!f||!i.value)return;checkForm(f,RULES[f.dataset.form],i.name)});
document.addEventListener('input',e=>{const i=e.target;if(i.matches&&i.matches('.field input[aria-invalid="true"]')){const f=i.closest('form[data-form]');if(f)checkForm(f,RULES[f.dataset.form],i.name)}
  if(i.dataset&&i.dataset.action==='usearch'){state.uq=i.value;const u=userRows();$('#ubody').innerHTML=u.html;$('#ucount').textContent=`Showing ${u.n} of ${state.users.length}`}
  if(i.id==='del-type'){$('#del-go').disabled=i.value.trim()!=='DELETE'}});

/* =========================================================
   CLICKS
   ========================================================= */
const refreshUsers=focusSel=>{const u=userRows();$('#ubody').innerHTML=u.html;$('#ucount').textContent=`Showing ${u.n} of ${state.users.length}`;if(focusSel){const el=$(focusSel);if(el)el.focus()}};
document.addEventListener('click',e=>{
  /* touch: first tap previews on laptop-width touch devices */
  const rl=e.target.closest('.row-link');if(rl&&matchMedia('(hover:none) and (min-width:900px)').matches){const row=rl.closest('.row');if(!row.classList.contains('is-active')){e.preventDefault();showPreview(row.dataset.id);return}}
  const a=e.target.closest('[data-action]');if(!a||a.tagName==='FORM'||a.tagName==='INPUT'||a.tagName==='SELECT')return;const act=a.dataset.action,id=a.dataset.id,uid=a.dataset.uid;
  switch(act){
   case 'stub':e.preventDefault();toast(a.dataset.msg);break;
   case 'menu':state.menu=!state.menu;renderNav();$('.menu-btn').focus();break;
   case 'role':state.role=a.dataset.role;const p=path();if(state.role==='visitor'&&(p==='/favorites'||p==='/account'||p.startsWith('/admin/')||p==='/favorites-empty'))location.hash='#/';else if(state.role!=='admin'&&p.startsWith('/admin/'))location.hash='#/favorites';else render();break;
   case 'logout':e.preventDefault();state.role='visitor';toast('Logged out.');if(path()!=='/')location.hash='#/';else render();break;
   case 'list':{if(state.role==='visitor'){toast('Log in to keep a My List.',{label:'Log in',fn:()=>location.hash='#/login'});break}
     const on=state.favs.has(id),t=T(id);on?state.favs.delete(id):state.favs.add(id);syncList();toast(on?`Removed ${t.n} from My List.`:`Added ${t.n} to My List.`,on?{label:'Undo',fn:()=>{state.favs.add(id);syncList()}}:null);break}
   case 'unfav':{const t=T(id),tray=a.closest('.tray'),cards=$$('.ticket',tray),i=cards.indexOf(a.closest('.ticket'));state.favs.delete(id);render();toast(`Removed ${t.n} from My List.`,{label:'Undo',fn:()=>{state.favs.add(id);render()}});
     const nb=$$('.stub button');(nb[Math.min(i,nb.length-1)]||$('.empty a,.empty button')||$('#main')).focus();break}
   case 'filter':state.filter=a.dataset.f;render();$(`[data-f="${state.filter}"]`).focus();break;
   case 'trailer':toast('The trailer opens TMDB\'s video link in a new tab.');break;
   case 'download':toast('Download is coming soon. This button is a placeholder behind the downloadButton flag.');break;
   case 'season':state.season=+a.dataset.s;$$('.seasons button').forEach(b=>b.setAttribute('aria-pressed',b===a));$('#eps').innerHTML=epList(T(path().split('/')[2]),state.season);break;
   case 'ticker':{const t=$('#ticker'),on=t.classList.toggle('is-paused');a.setAttribute('aria-pressed',on);a.setAttribute('aria-label',on?'Play genre ticker':'Pause genre ticker');$('use',a).setAttribute('href',on?'#i-play':'#i-pause');break}
   case 'peek':{const i=$('input',a.parentElement),show=i.type==='password';i.type=show?'text':'password';a.setAttribute('aria-pressed',show);a.setAttribute('aria-label',show?'Hide password':'Show password');$('use',a).setAttribute('href',show?'#i-eyeoff':'#i-eye');break}
   case 'block':{const u=state.users.find(x=>x.id===uid);u.blocked=!u.blocked;refreshUsers(`[data-action="block"][data-uid="${uid}"]`);toast(`${u.name} ${u.blocked?'blocked. Their sessions end now.':'unblocked.'}`);break}
   case 'del-ask':state.delId=uid;refreshUsers(`[data-action="del-no"][data-uid="${uid}"]`);break;
   case 'del-no':state.delId=null;refreshUsers(`[data-action="del-ask"][data-uid="${uid}"]`);break;
   case 'del-yes':{const u=state.users.find(x=>x.id===uid);state.users=state.users.filter(x=>x.id!==uid);state.delId=null;$('#ucount')&&0;const h=$('.ph p');if(h)h.textContent=`${state.users.length} registered`;refreshUsers('#uq');toast(`Deleted ${u.name}.`);break}
   case 'del-open':$('#del-zone').innerHTML=`<div class="confirm" role="group" aria-labelledby="dch"><h3 id="dch">Delete your account for good?</h3><p>This removes your account and your ${state.favs.size} favorites. Type <b class="mono">DELETE</b> to confirm.</p><div class="field"><label for="del-type">Type DELETE</label><div class="inp"><input id="del-type" type="text" autocomplete="off"></div></div><div class="row-btns"><button class="btn btn--danger btn--flat" id="del-go" type="button" data-action="del-go" disabled>Delete account</button><button class="btn btn--line btn--flat" type="button" data-action="del-cancel">Keep my account</button></div></div>`;$('#del-type').focus();break;
   case 'del-cancel':$('#del-zone').innerHTML=`<button class="btn btn--danger btn--flat" type="button" data-action="del-open">Delete my account...</button>`;$('[data-action="del-open"]').focus();break;
   case 'del-go':state.role='visitor';state.favs.clear();location.hash='#/';toast('Account deleted. Your favorites were removed.');break;
   case 'resend':toast('Verification link sent again.');startCountdown(30);break}});
document.addEventListener('change',e=>{const s=e.target.closest('[data-action="role-sel"]');if(!s)return;const u=state.users.find(x=>x.id===s.dataset.uid);u.role=s.value;toast(`${u.name} is now ${u.role==='admin'?'an admin':'a user'}.`)});
/* index hover / focus -> live preview */
const rowEv=e=>{const r=e.target.closest&&e.target.closest('.row');if(r&&matchMedia('(min-width:900px)').matches)showPreview(r.dataset.id)};
document.addEventListener('mouseover',rowEv);document.addEventListener('focusin',rowEv);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.menu){state.menu=false;renderNav();$('.menu-btn').focus()}
  if((e.key==='ArrowDown'||e.key==='ArrowUp')&&e.target.closest&&e.target.closest('.row-link')){const rows=$$('.row-link'),i=rows.indexOf(e.target.closest('.row-link')),n=rows[i+(e.key==='ArrowDown'?1:-1)];if(n&&matchMedia('(min-width:900px)').matches){e.preventDefault();n.focus()}}});
addEventListener('resize',()=>{if(path()==='/'&&matchMedia('(min-width:900px)').matches&&!$('.pv-body').children.length)showPreview(state.pv||TITLES[0].id,true)});
render();
</script>
</body>
</html>
