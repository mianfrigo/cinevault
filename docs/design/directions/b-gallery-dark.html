<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinevault: Gallery Dark</title>
<meta name="description" content="Cinevault design direction B, Gallery Dark: a content-first dark gallery. Synthetic placeholder art.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ===================== DESIGN TOKENS (port to Angular as-is) ===================== */
:root{
  /* color: warm near-black ground, artwork is the only colour */
  --ground:#0a0908;
  --ground-2:#110f0d;
  --mat:#171511;
  --rule:#2b2824;
  --rule-strong:#47433b;
  --ink:#eeeae2;
  --ink-2:#bdb7ac;
  --ink-3:#9a9488;
  --brass:#cdae78;          /* the single accent: focus, active, primary */
  --brass-ink:#0a0908;
  --danger:#ee8a70;
  --ok:#9cc59a;
  --scrim:rgba(5,4,3,.72);

  /* type */
  --font-display:'Bodoni Moda','Bodoni 72','Didot','Bodoni MT',Georgia,'Times New Roman',serif;
  --font-ui:'Jost','Futura','Avenir Next','Century Gothic','Segoe UI',system-ui,sans-serif;
  --t-xs:.75rem;     /* 12 labels / captions */
  --t-sm:.875rem;    /* 14 */
  --t-md:1rem;       /* 16 body */
  --t-lg:1.25rem;
  --t-xl:clamp(1.625rem,2.6vw,2.25rem);
  --t-2xl:clamp(2.25rem,4.6vw,3.75rem);
  --t-3xl:clamp(2.75rem,6.4vw,5.5rem);   /* display max 6rem */
  --track-caps:.14em;
  --lh-body:1.7;

  /* space (4px base) */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px; --s-8:64px; --s-9:96px; --s-10:144px;
  --gutter:clamp(16px,4vw,56px);
  --gap:clamp(12px,2vw,24px);

  /* shape */
  --r-0:0; --r-1:2px; --r-pill:999px;
  --mat-pad:14px;

  /* layout */
  --sw-h:40px; --top-h:52px; --tab-h:60px; --rail-w:204px;

  /* motion */
  --ease:cubic-bezier(.16,1,.3,1);
  --dur-slow:1100ms; --dur:600ms; --dur-fast:200ms;
}

/* ===================== BASE ===================== */
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark;-webkit-text-size-adjust:100%;scrollbar-color:#3a362f var(--ground);scrollbar-width:thin}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--ground);color:var(--ink);font:300 var(--t-md)/var(--lh-body) var(--font-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;caret-color:var(--brass);padding-top:var(--sw-h)}
::selection{background:var(--brass);color:var(--brass-ink)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--ground)}::-webkit-scrollbar-thumb{background:#3a362f;border:2px solid var(--ground)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img,svg{max-width:100%}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none}
.num{font-variant-numeric:tabular-nums lining-nums}
.cap-meta{font:400 var(--t-xs)/1.5 var(--font-ui);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--ink-3)}
.hair{border:0;border-top:1px solid var(--rule);margin:0}
.t-it{font-family:var(--font-display);font-style:italic;font-weight:400}

/* ===================== MOCKUP SWITCHER (outside product chrome) ===================== */
.sw{position:fixed;inset:0 0 auto 0;height:var(--sw-h);z-index:100;display:flex;align-items:center;gap:6px;padding:0 10px;background:#e4e2dd;color:#161616;font:500 12px/1 system-ui,-apple-system,'Segoe UI',sans-serif;overflow-x:auto;white-space:nowrap;scrollbar-width:none;border-bottom:1px solid #b9b6af}
.sw::-webkit-scrollbar{display:none}
.sw b{font-weight:700;margin-right:4px;flex:none}
.sw a,.sw button{flex:none;border:1px solid #a9a69f;background:#f4f3f0;color:#161616;padding:5px 9px;border-radius:3px;font:inherit;cursor:pointer;text-decoration:none}
.sw a[aria-current="page"],.sw button[aria-pressed="true"]{background:#161616;color:#fff;border-color:#161616}
.sw a:focus-visible,.sw button:focus-visible{outline:2px solid #0a58ca;outline-offset:1px}
.sw .sep{width:1px;height:18px;background:#a9a69f;flex:none;margin:0 4px}
.sw .note{color:#4a4a4a;font-weight:400;margin-left:auto;padding-left:12px;flex:none}
@media (max-width:899px){.sw .note{display:none}}

/* ===================== SHELL ===================== */
.shell{min-height:calc(100svh - var(--sw-h));display:flex;flex-direction:column;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom))}
main{flex:1;padding-top:var(--top-h);outline:none}
.page{padding:0 var(--gutter);max-width:1360px}
.rail{display:none}

/* top bar (phone) */
.topbar{position:fixed;top:var(--sw-h);left:0;right:0;height:var(--top-h);z-index:40;background:var(--ground);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 var(--gutter)}
.wm{font:400 1.5rem/1 var(--font-display);letter-spacing:.01em;color:var(--ink);display:inline-flex;align-items:baseline}
.wm i{font-style:italic}
.ib{display:inline-grid;place-items:center;min-width:44px;min-height:44px;background:none;border:0;color:var(--ink-2);cursor:pointer}
.ib:hover{color:var(--ink)}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid var(--rule-strong);border-radius:50%;font:400 .75rem/1 var(--font-ui);letter-spacing:.06em;color:var(--ink)}

/* bottom tabs (phone) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--ground);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:44px;background:none;border:0;color:var(--ink-3);font:400 var(--t-xs)/1 var(--font-ui);letter-spacing:.06em;cursor:pointer}
.tabbar [aria-current="page"]{color:var(--brass)}

/* bottom sheet */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity var(--dur) var(--ease),visibility 0s var(--dur)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:calc(100svh - var(--sw-h) - 24px);overflow:auto;background:var(--ground-2);border-top:1px solid var(--rule-strong);padding:var(--s-4) var(--gutter) calc(var(--s-6) + env(safe-area-inset-bottom));transform:translateY(102%);visibility:hidden;transition:transform var(--dur) var(--ease),visibility 0s var(--dur)}
.sheet.open{transform:none;visibility:visible;transition:transform var(--dur) var(--ease)}
.scrim.open{opacity:1;visibility:visible;transition:opacity var(--dur) var(--ease)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s-3)}
.sheet-h span{font:400 var(--t-xs)/1 var(--font-ui);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--ink-3)}

/* nav lists (rail + sheet) */
.nav a{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--ink-2);font:300 1.0625rem/1.2 var(--font-ui);position:relative;transition:color var(--dur-fast)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]::before{content:"";width:14px;height:1px;background:var(--brass);flex:none;margin-left:-22px;margin-right:8px}
.nav-g{margin-top:var(--s-4);padding-top:var(--s-3);border-top:1px solid var(--rule)}
.nav-g>span{display:block;font:400 var(--t-xs)/1 var(--font-ui);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--ink-3);padding:var(--s-2) 0}
.sheet .nav a[aria-current="page"]::before{margin-left:0}
.search{position:relative;display:flex;align-items:center;border-bottom:1px solid var(--rule-strong);color:var(--ink-3)}
.search:focus-within{border-color:var(--brass)}
.search input{flex:1;min-width:0;height:44px;background:none;border:0;color:var(--ink);font:300 1rem var(--font-ui);padding:0 0 0 8px;outline:none}
.search input::placeholder{color:var(--ink-3);opacity:1}

/* desktop rail */
@media (min-width:1024px){
  .topbar,.tabbar{display:none}
  .shell{padding-left:var(--rail-w);padding-bottom:0}
  main{padding-top:0}
  .rail{display:flex;flex-direction:column;position:fixed;left:0;top:var(--sw-h);bottom:0;width:var(--rail-w);padding:var(--s-6) 28px var(--s-5) 40px;border-right:1px solid var(--rule);background:var(--ground);z-index:30;overflow:auto}
  .rail .wm{font-size:1.75rem;margin-bottom:var(--s-7)}
  .rail .search{margin:var(--s-5) 0 var(--s-2)}
  .rail-user{margin-top:auto;padding-top:var(--s-5);display:grid;gap:var(--s-3)}
  .rail-user .who{display:flex;gap:10px;align-items:center;font-size:var(--t-sm);color:var(--ink-2);line-height:1.3}
  .rail-user .who small{display:block;color:var(--ink-3);font-size:var(--t-xs)}
  .sheet,.scrim{display:none}
}

/* ===================== PRIMITIVES ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:0 22px;border:1px solid var(--rule-strong);border-radius:var(--r-0);background:transparent;color:var(--ink);font:400 .8125rem/1 var(--font-ui);letter-spacing:var(--track-caps);text-transform:uppercase;cursor:pointer;transition:border-color var(--dur-fast),background-color var(--dur-fast),color var(--dur-fast)}
.btn:hover{border-color:var(--ink-2);background:rgba(255,255,255,.04)}
.btn-primary{border-color:var(--brass);color:var(--brass)}
.btn-primary:hover{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn-dashed{border-style:dashed;color:var(--ink-2)}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:var(--brass-ink);border-color:var(--danger)}
.btn[disabled],.tbtn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn[aria-pressed="true"]{border-color:var(--ink-2)}
.btn-row{display:flex;flex-wrap:wrap;gap:var(--s-3)}
.tag{display:inline-block;padding:3px 7px;border:1px solid var(--rule-strong);font:400 var(--t-xs)/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border-radius:var(--r-1)}
.tlink{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:.28em;text-decoration-thickness:1px;transition:text-decoration-color var(--dur-fast)}
.tlink:hover{text-decoration-color:var(--brass)}
.pill{min-height:44px;padding:0 18px;border:1px solid var(--rule-strong);border-radius:var(--r-pill);background:none;color:var(--ink-2);font:400 .8125rem/1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill:hover{color:var(--ink);border-color:var(--ink-3)}
.pill[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.pill .n{color:var(--ink-3)}
.pill[aria-pressed="true"] .n{color:var(--brass)}

/* the frame: poster as hung artwork */
.frame{display:block;position:relative;background:var(--mat);padding:var(--mat-pad);border:1px solid var(--rule);box-shadow:0 34px 50px -34px #000,0 2px 8px rgba(0,0,0,.55)}
.frame::after{content:"";position:absolute;inset:calc(var(--mat-pad) - 1px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.55);pointer-events:none}
.frame-xl{--mat-pad:clamp(14px,2.2vw,30px)}
.frame-lg{--mat-pad:clamp(12px,1.8vw,24px)}
.frame-sm{--mat-pad:clamp(6px,.9vw,11px)}
.frame-xs{--mat-pad:5px}
.art{display:block;width:100%;height:auto;aspect-ratio:2/3;transition:filter var(--dur) var(--ease)}
.art.wide{aspect-ratio:21/9}

/* wall tiles */
.tile{display:block}
.tile .cap{display:block;margin-top:var(--s-3);transition:transform var(--dur) var(--ease)}
.tile .cap-title{display:block;font:300 1.0625rem/1.3 var(--font-ui);color:var(--ink);overflow-wrap:anywhere}
.tile .cap-meta{display:block;margin-top:3px}
.tile .cap-more{display:block;margin-top:6px;font:400 var(--t-xs)/1 var(--font-ui);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--brass);opacity:0;transform:translateX(-8px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
@media (hover:hover){
  .tile:hover .art,.tile:focus-visible .art{filter:brightness(1.12) saturate(1.05)}
  .tile:hover .cap,.tile:focus-visible .cap{transform:translateY(-3px)}
  .tile:hover .cap-more,.tile:focus-visible .cap-more{opacity:1;transform:none}
}
.tile:focus-visible{outline-offset:6px}

/* section label (exhibition label) */
.sec{padding-top:var(--s-9)}
.sec-h{display:flex;align-items:baseline;gap:var(--s-4);margin-bottom:var(--s-6)}
.sec-h h2{font:400 var(--t-xl)/1.1 var(--font-display);letter-spacing:-.005em}
.sec-h .rule{flex:1;border-bottom:1px solid var(--rule);transform:translateY(-.3em)}
.sec-h .pl{font:400 var(--t-sm)/1 var(--font-ui);letter-spacing:.14em;color:var(--ink-3)}

/* ===================== HOME: FEATURED WORK ===================== */
.feat{padding:var(--s-5) var(--gutter) 0;min-height:calc(100svh - var(--sw-h) - var(--top-h) - var(--tab-h))}
.feat-grid{display:grid;gap:var(--s-5);grid-template-columns:minmax(0,1fr)}
.feat-poster .frame{width:min(80vw,calc((100svh - 330px) * .66),400px);margin:0 auto}
.feat-still{display:none}
.feat-cap{margin-top:var(--s-1)}
.feat-title{font:italic 400 var(--t-2xl)/1.02 var(--font-display);letter-spacing:-.012em;margin:var(--s-2) 0 var(--s-3);text-wrap:balance}
.feat-ov{color:var(--ink-2);max-width:52ch;margin-bottom:var(--s-5);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.feat-ctl{display:flex;align-items:center;gap:var(--s-2);margin-top:var(--s-5);color:var(--ink-3)}
.feat-ctl .counter{font:400 var(--t-sm)/1 var(--font-ui);letter-spacing:.14em;min-width:72px;text-align:center}
.feat-ctl .ib{border:1px solid var(--rule-strong)}
.feat-ctl .ib:hover{border-color:var(--ink-2)}
@media (min-width:720px){
  .feat-still{display:block}
  .feat-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:var(--s-7);align-items:center;min-height:calc(100svh - var(--sw-h) - 60px)}
  .feat-poster .frame{width:min(100%,calc((100svh - var(--sw-h) - 130px) / 1.5),520px);margin:0}
  .feat-cap{margin-top:var(--s-6)}
}
@media (min-width:720px) and (max-width:1023px){
  .feat{min-height:0}
  .feat-grid{min-height:0;padding-top:var(--s-4)}
}

/* feature reveal: the one authored moment */
@keyframes unveil{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes still-in{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.feat.swap .feat-poster .frame{animation:unveil var(--dur-slow) var(--ease) both}
.feat.swap .feat-still{animation:still-in 1300ms var(--ease) 120ms both}
.feat.swap .feat-cap>*{animation:rise 900ms var(--ease) both}
.feat.swap .feat-cap>:nth-child(2){animation-delay:90ms}
.feat.swap .feat-cap>:nth-child(3){animation-delay:170ms}
.feat.swap .feat-cap>:nth-child(4){animation-delay:250ms}

/* scroll reveals (JS adds .pre only if motion allowed) */
.pre{opacity:0}
.pre.in{opacity:1;transition:opacity 1s var(--ease) var(--d,0ms)}
.tile.pre .frame{clip-path:inset(0 0 100% 0)}
.tile.pre.in .frame{clip-path:inset(0 0 0 0);transition:clip-path 1.3s var(--ease) var(--d,0ms)}

/* ===================== WALL (staggered, asymmetric) ===================== */
.wall{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:var(--s-7);align-items:start}
.wall>li{min-width:0}
.wall>li:nth-child(4n+1){grid-column:1/span 7}
.wall>li:nth-child(4n+2){grid-column:8/span 5;margin-top:var(--s-8)}
.wall>li:nth-child(4n+3){grid-column:1/span 5}
.wall>li:nth-child(4n+4){grid-column:6/span 7;margin-top:var(--s-6)}
@media (min-width:640px){
  .wall{row-gap:var(--s-8)}
  .wall>li:nth-child(4n+1){grid-column:1/span 6}
  .wall>li:nth-child(4n+2){grid-column:8/span 4;margin-top:var(--s-9)}
  .wall>li:nth-child(4n+3){grid-column:2/span 4;margin-top:0}
  .wall>li:nth-child(4n+4){grid-column:7/span 5;margin-top:var(--s-7)}
}
@media (min-width:1024px){
  .wall{row-gap:var(--s-9)}
  .wall>li:nth-child(6n+1){grid-column:1/span 4;margin-top:0}
  .wall>li:nth-child(6n+2){grid-column:6/span 3;margin-top:var(--s-9)}
  .wall>li:nth-child(6n+3){grid-column:10/span 3;margin-top:var(--s-5)}
  .wall>li:nth-child(6n+4){grid-column:2/span 3;margin-top:0}
  .wall>li:nth-child(6n+5){grid-column:6/span 4;margin-top:var(--s-7)}
  .wall>li:nth-child(6n+6){grid-column:11/span 2;margin-top:var(--s-4)}
}
.wall--b{direction:rtl}
.wall--b>li{direction:ltr}

/* series split */
.split{display:grid;gap:var(--s-7)}
.split-feature .cap{display:block;margin-top:var(--s-4)}
.split-feature h3{font:italic 400 var(--t-xl)/1.15 var(--font-display)}
.split-feature p{color:var(--ink-2);margin-top:var(--s-2);max-width:56ch}
.thumbs li{border-top:1px solid var(--rule)}
.thumbs li:last-child{border-bottom:1px solid var(--rule)}
.thumbs a{display:grid;grid-template-columns:64px 1fr auto;gap:var(--s-4);align-items:center;padding:var(--s-4) 0;min-height:44px}
.thumbs .t{font:300 1.125rem/1.25 var(--font-ui)}
.thumbs .go{color:var(--ink-3);transition:transform var(--dur) var(--ease),color var(--dur-fast)}
.thumbs a:hover .go{transform:translateX(4px);color:var(--brass)}
.thumbs a:hover .t{color:#fff}
@media (min-width:900px){.split{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s-8);align-items:start}}

/* genre index */
.index{display:grid;column-gap:var(--s-8)}
@media (min-width:720px){.index{grid-template-columns:1fr 1fr}}
.index a{display:flex;align-items:baseline;gap:var(--s-3);min-height:52px;padding:var(--s-3) 0;border-bottom:1px solid var(--rule);font:300 1.375rem/1.2 var(--font-display);font-style:italic;transition:color var(--dur-fast)}
.index a .l{flex:1;transition:transform var(--dur) var(--ease)}
.index a .c{font:400 var(--t-sm)/1 var(--font-ui);font-style:normal;color:var(--ink-3);letter-spacing:.08em}
.index a:hover{color:var(--brass)}
.index a:hover .l{transform:translateX(6px)}
.note-s{color:var(--ink-3);font-size:var(--t-sm);margin-top:var(--s-4)}

/* ===================== PAGE HEAD ===================== */
.pg{padding:var(--s-6) var(--gutter) var(--s-9)}
.pg-h{margin-bottom:var(--s-5);display:grid;gap:var(--s-3)}
.pg-h h1{font:400 var(--t-2xl)/1 var(--font-display);letter-spacing:-.015em}
.pg-h h1 em{font-style:italic}
.pg-h p{color:var(--ink-2);max-width:56ch}
.dnav{display:flex;gap:var(--s-5);flex-wrap:wrap;border-bottom:1px solid var(--rule);margin-bottom:var(--s-5)}
.dnav a{display:inline-flex;align-items:center;min-height:48px;color:var(--ink-3);font:400 .8125rem/1 var(--font-ui);letter-spacing:var(--track-caps);text-transform:uppercase;border-bottom:1px solid transparent;margin-bottom:-1px}
.dnav a:hover{color:var(--ink)}
.dnav a[aria-current="page"]{color:var(--brass);border-bottom-color:var(--brass)}

/* ===================== TITLE PAGE (wall label) ===================== */
.tp{display:grid;gap:var(--s-7);padding:var(--s-6) var(--gutter) 0}
.tp-poster .frame{width:min(86vw,460px);margin:0 auto}
.tp-poster .plate{margin-top:var(--s-4);text-align:center}

const r=v=>Math.round(v*10)/10;
const MOTIF={
 horizon:(w,h,p,u)=>`<circle cx="${w*.5}" cy="${h*.47}" r="${r(u*.24)}" fill="${p[1]}"/><rect y="${h*.5}" width="${w}" height="${h*.5}" fill="${p[2]}"/>`+[[.3,.4,.014,.8],[.38,.24,.012,.55],[.44,.12,.01,.35]].map((a,i)=>`<rect x="${w*a[0]}" y="${h*(.54+.04*i)}" width="${w*a[1]}" height="${h*a[2]}" fill="${p[1]}" opacity="${a[3]}"/>`).join(''),
 rings:(w,h,p,u)=>[1,2,3,4,5,6].map(i=>`<circle cx="${w*.58}" cy="${h*.32}" r="${r(u*.07*i)}" fill="none" stroke="${p[i%2?1:2]}" stroke-width="${r(u*(i===3?.016:.006))}" opacity="${r(1-i*.1)}"/>`).join('')+`<circle cx="${w*.58}" cy="${h*.32}" r="${r(u*.045)}" fill="${p[2]}"/>`,
 waves:(w,h,p,u)=>`<circle cx="${w*.68}" cy="${h*.2}" r="${r(u*.1)}" fill="${p[1]}"/>`+[0,1,2,3,4,5].map(i=>{const y=h*(.24+.06*i),a=u*.04;return `<path d="M0 ${r(y)} Q ${w*.25} ${r(y-a*2)} ${w*.5} ${r(y)} T ${w} ${r(y)}" fill="none" stroke="${p[1+i%2]}" stroke-width="${r(u*.012)}" opacity="${r(.4+i*.1)}"/>`}).join(''),
 arch:(w,h,p,u)=>{const x0=w*.26,x1=w*.74,rr=(x1-x0)/2,top=h*.12,b=h*.55,i=w*.07;return `<path d="M${x0} ${b}V${top+rr}A${rr} ${rr} 0 0 1 ${x1} ${top+rr}V${b}Z" fill="${p[2]}"/><path d="M${x0+i} ${b}V${top+rr}A${rr-i} ${rr-i} 0 0 1 ${x1-i} ${top+rr}V${b}Z" fill="${p[1]}"/><rect x="${w*.14}" y="${b}" width="${w*.72}" height="${h*.012}" fill="${p[2]}"/>`},
 tri:(w,h,p,u)=>`<polygon points="${w*.1},${h*.58} ${w*.5},${h*.12} ${w*.9},${h*.58}" fill="${p[1]}"/><polygon points="${w*.42},${h*.58} ${w*.68},${h*.3} ${w*.94},${h*.58}" fill="${p[2]}"/><circle cx="${w*.24}" cy="${h*.2}" r="${r(u*.06)}" fill="${p[2]}"/>`,
 split:(w,h,p,u)=>`<rect width="${w*.5}" height="${h}" fill="${p[1]}" opacity=".16"/><circle cx="${w*.5}" cy="${h*.42}" r="${r(u*.22)}" fill="${p[1]}"/><circle cx="${w*.5}" cy="${h*.42}" r="${r(u*.12)}" fill="${p[0]}"/><rect x="${w*.499}" width="${w*.004}" height="${h}" fill="${p[1]}" opacity=".6"/>`,
 grid:(w,h,p,u)=>{const c=Math.max(4,Math.round(w/38)),rw=Math.max(5,Math.round(h*.5/38)),hi=Math.floor(c*rw*.38);let s='';for(let j=0;j<rw;j++)for(let i=0;i<c;i++){const x=w*(.12+.76*i/(c-1)),y=h*(.08+.46*j/(rw-1)),k=j*c+i;s+=k===hi?`<rect x="${r(x-u*.05)}" y="${r(y-u*.05)}" width="${r(u*.1)}" height="${r(u*.1)}" fill="${p[2]}"/>`:`<circle cx="${r(x)}" cy="${r(y)}" r="${r(u*.011)}" fill="${p[1]}" opacity=".6"/>`}return s},
 stripes:(w,h,p,u)=>[.9,.6,.75,.45,.85,.55,.7,.4].map((k,i)=>`<rect x="${i%2?w*(1-k)+0:0}" y="${h*(.12+.055*i)}" width="${w*k}" height="${h*.04}" fill="${p[1+i%2]}" opacity="${r(.5+i*.07)}"/>`).join(''),
 diag:(w,h,p,u)=>[[.18,.14,1,1],[.42,.08,2,1],[.62,.16,1,.6]].map(a=>{const x=w*a[0],d=w*a[1],s=w*.3;return `<polygon points="${r(x)},0 ${r(x+d)},0 ${r(x+d-s)},${h} ${r(x-s)},${h}" fill="${p[a[2]]}" opacity="${a[3]}" transform="translate(${r(w*.22)} 0)"/>`}).join(''),
 eclipse:(w,h,p,u)=>`<circle cx="${w*.5}" cy="${h*.4}" r="${r(u*.26)}" fill="${p[1]}"/><circle cx="${r(w*.5+u*.07)}" cy="${r(h*.4-u*.03)}" r="${r(u*.24)}" fill="${p[0]}"/><circle cx="${w*.5}" cy="${h*.4}" r="${r(u*.34)}" fill="none" stroke="${p[2]}" stroke-width="${r(u*.004)}"/><circle cx="${r(w*.5-u*.34)}" cy="${h*.4}" r="${r(u*.018)}" fill="${p[2]}"/>`,
 sun:(w,h,p,u)=>`<circle cx="${w*.5}" cy="${h*.38}" r="${r(u*.2)}" fill="${p[1]}"/><circle cx="${w*.5}" cy="${h*.38}" r="${r(u*.3)}" fill="none" stroke="${p[2]}" stroke-width="${r(u*.006)}"/><rect y="${h*.7}" width="${w}" height="${h*.3}" fill="${p[2]}" opacity=".28"/><rect y="${h*.7}" width="${w}" height="${h*.006}" fill="${p[1]}"/>`
};
function lines(title,max){const out=[];let cur='';title.split(' ').forEach(wd=>{if(cur&&(cur+' '+wd).length>max){out.push(cur);cur=wd}else cur=cur?cur+' '+wd:wd});out.push(cur);return out}
function art(t,kind='poster',label){
  const wide=kind==='wide',w=wide?420:200,h=wide?180:300,u=Math.min(w,h*.67),p=t.pal;
  const ls=lines(t.title,wide?24:10),mx=Math.max(...ls.map(l=>l.length));
  const sans=!!t.sans, k=sans?.74:.52;
  const size=r(Math.min(wide?h*.12:w*.15,(wide?w*.55:w*.8)/(mx*k)));
  const x=w*(wide?.07:.1),base=h*(wide?.88:.93);
  const txt=ls.map((l,i)=>`<text x="${x}" y="${r(base-(ls.length-1-i)*size*1.12)}" fill="${p[3]}" font-size="${size}" ${sans?`font-family="Jost,Futura,sans-serif" font-weight="500" letter-spacing="${r(size*.1)}"`:`font-family="'Bodoni Moda',Didot,Georgia,serif" font-style="italic" font-weight="400"`}>${esc(sans?l.toUpperCase():l)}</text>`).join('');
  const rule=`<rect x="${x}" y="${r(base-(ls.length-1)*size*1.12-size*1.25)}" width="${w*.1}" height="${wide?.8:.7}" fill="${p[3]}" opacity=".7"/>`;
  const yr=`<text x="${x}" y="${h*.075+ (wide?6:0)}" fill="${p[3]}" opacity=".75" font-size="${wide?9:7.5}" font-family="Jost,Futura,sans-serif" letter-spacing="1.4">${t.year}</text>`;
  return `<svg class="art${wide?' wide':''}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" ${label?`role="img" aria-label="${esc(label)}"`:'aria-hidden="true" focusable="false"'} style="background:${p[0]}"><rect width="${w}" height="${h}" fill="${p[0]}"/>${MOTIF[t.motif](w,h,p,u)}${yr}${rule}${txt}</svg>`;
}

    const blocked=u.status==='blocked';
    return `<tr data-id="${u.id}" data-blocked="${blocked?1:0}"><td class="who" data-l="User"><span class="u-name">${esc(u.name)}${u.you?' <span class="tag" style="margin-left:6px">You</span>':''}</span><span class="u-mail">${esc(u.email)}</span></td>
    <td data-l="Role"><label class="sr" for="role-${u.id}">Role for ${esc(u.name)}</label><select class="sel" id="role-${u.id}" data-uact="role" data-id="${u.id}"${u.you?' disabled':''}><option value="user"${u.role==='user'?' selected':''}>User</option><option value="admin"${u.role==='admin'?' selected':''}>Admin</option></select></td>
    <td data-l="Status">${chip(u)}</td><td data-l="Joined" class="num">${fmtDate(u.joined)}</td>
    <td class="acts"><button type="button" class="tbtn" data-uact="block" data-id="${u.id}" aria-label="${blocked?'Unblock':'Block'} ${esc(u.name)}"${u.you?' disabled':''}>${blocked?'Unblock':'Block'}</button><button type="button" class="tbtn tbtn-danger" data-uact="ask" data-id="${u.id}" aria-label="Delete ${esc(u.name)}"${u.you?' disabled':''}>Delete</button></td></tr>`}).join('');
}
function renderUsers(){
  return `<div class="pg"><div class="pg-h"><h1><em class="t-it">Users</em></h1><p>Search, change roles, block or remove accounts.</p></div>${dnav('usr')}
  <div class="toolbar"><div class="field" data-f="uq"><label for="uq">Search by name or email</label><div class="ctl"><input id="uq" type="search" autocomplete="off" placeholder="Name or email" value="${esc(state.q)}"></div></div><p class="count num" id="ucount" aria-live="polite"></p></div>
  <table class="tbl"><thead><tr><th scope="col">User</th><th scope="col">Role</th><th scope="col">Status</th><th scope="col">Joined</th><th scope="col"><span class="sr">Actions</span></th></tr></thead><tbody id="ubody"></tbody></table></div>`;
}
function renderOverview(){
  const total=state.users.length,week=state.users.filter(u=>(TODAY-new Date(u.joined+'T12:00:00'))/864e5<7).length;
  const recent=[...state.users].sort((a,b)=>b.joined.localeCompare(a.joined)).slice(0,5);
  return `<div class="pg"><div class="pg-h"><h1><em class="t-it">Overview</em></h1><p>A short reading of who is here.</p></div>${dnav('ovw')}
  <div class="ov-grid"><div><p class="statement"><span class="n num">${total}</span> <span class="dim">people hold an account.</span><br><span class="n num">${week}</span> <span class="dim">joined in the last seven days.</span></p><p class="note-s" style="margin-top:24px">Counts follow the Users list. <a class="tlink" href="#/admin/users">Manage users</a></p></div>
  <section aria-labelledby="rs"><h2 id="rs">Recent signups</h2><ul class="recent">${recent.map(u=>`<li><div><span class="u-name" style="display:block">${esc(u.name)}</span><span class="u-mail">${esc(u.email)}</span></div><div style="text-align:right">${chip(u)}<div class="when num">${fmtDate(u.joined)}</div></div></li>`).join('')}</ul></section></div></div>`;
}
const denied=()=>`<div class="pg"><div class="empty"><h2>This page is for administrators</h2><p>Your account does not have access. Switch the mockup role to Admin to view it.</p><a class="btn btn-primary" href="#/home">Back to home</a></div></div>`;

/* ===================== router ===================== */
function parse(){const h=location.hash.replace(/^#\/?/,'');const[p,q='']=h.split('?');return{path:p||'home',seg:(p||'home').split('/'),q:new URLSearchParams(q)}}
let lastPath='';
function route(){
  const{path,seg,q}=parse();const main=$('#main');let html,after,title='Cinevault';
  clearInterval(resendT);
  const needUser=['favorites','account'].includes(seg[0]);
  if(needUser&&state.role==='visitor'){location.replace('#/login?need=1');return}
  if(seg[0]==='favorites'){if(q.get('seed')==='1')state.favs=['m1','m3','m4','m5','m9','s1','s3'];if(q.get('seed')==='0')state.favs=[];}
  switch(seg[0]){
   case 'home':html=renderHome(q);after=()=>afterHome(q);break;
   case 'title':html=renderTitle(seg[1]);title=(byId[seg[1]]||byId.m1).title;after=syncFav;break;
   case 'browse':html=renderBrowse(seg);title='Browse';break;
   case 'search':html=renderSearch(q);title='Search';break;
   case 'favorites':html=renderFav();title='My collection';break;
   case 'account':html=renderAccount();title='Account';after=()=>updRules('r-acc','');break;
   case 'admin':if(state.role!=='admin'){html=denied();break}
      if(seg[1]==='overview'){html=renderOverview();title='Overview'}else{html=renderUsers();title='Users';after=()=>{$('#ubody').innerHTML=rowsHtml()}}break;
   case 'login':html=renderLogin(q);title='Log in';break;
   case 'register':html=renderRegister();title='Create account';after=()=>updRules('r-reg','');break;
   case 'forgot':html=renderForgot();title='Forgot password';break;
   case 'check-email':html=renderCheck(q);title='Check your email';after=startResend;break;
   default:html=renderHome(q);after=()=>afterHome(q);
  }
  main.innerHTML=html;document.title=title+' · Cinevault';
  renderChrome();renderSwitcher();sheet(false);
  if(after)after();
  if(path!==lastPath||!q.get('at'))if(!(seg[0]==='home'&&q.get('at')))window.scrollTo(0,0);
  lastPath=path;
  observe();
}
function observe(){
  if(reduced||!('IntersectionObserver' in window)){$$('.pre').forEach(e=>e.classList.remove('pre'));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px',threshold:.05});
  $$('.pre').forEach(e=>io.observe(e));
}
addEventListener('hashchange',route);

/* ===================== events ===================== */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act],[data-fav],[data-filter],[data-rm],[data-uact],[data-setrole],[data-show],#sw a,#scrim,.sheet a');
  if(!a)return;
  if(a.id==='scrim'||a.matches('.sheet a')){sheet(false);return}
  if(a.matches('#sw a')){const r=a.dataset.role;if(r==='user'&&state.role==='visitor')state.role='user';if(r==='admin')state.role='admin';if(r==='visitor')state.role='visitor';return}
  if(a.dataset.setrole){state.role=a.dataset.setrole;route();return}
  if(a.dataset.fav){
    if(state.role==='visitor'){toast('Log in to add titles to your list.',['login','Log in']);return}
    const id=a.dataset.fav,i=state.favs.indexOf(id);
    if(i>=0){state.favs.splice(i,1);toast(`Removed <em class="t-it">${esc(byId[id].title)}</em> from your list.`)}else{state.favs.push(id);toast(`Added <em class="t-it">${esc(byId[id].title)}</em> to your list.`)}
    syncFav();return}
  if(a.dataset.filter){state.filter=a.dataset.filter;$('#main').innerHTML=renderFav();$$('.pill')[['all','movie','series'].indexOf(state.filter)]?.focus();return}
  if(a.dataset.rm){
    const id=a.dataset.rm,li=a.closest('li');state.lastRm={id,i:state.favs.indexOf(id)};
    const done=()=>{state.favs=state.favs.filter(x=>x!==id);$('#main').innerHTML=renderFav();toast(`Removed <em class="t-it">${esc(byId[id].title)}</em> from your collection.`,['undo','Undo']);($('.hang .rm')||$('.empty a,.empty .btn')||$('#main')).focus()};
    if(reduced)done();else{li.classList.add('gone');setTimeout(done,420)}return}
  if(a.dataset.show){const inp=$('#'+a.dataset.show),on=inp.type==='password';inp.type=on?'text':'password';a.textContent=on?'Hide':'Show';a.setAttribute('aria-pressed',on);return}
  if(a.dataset.uact){userAct(a);return}
  switch(a.dataset.act){
   case 'feat-prev':showFeat(fi-1);break;
   case 'feat-next':showFeat(fi+1);break;
   case 'sheet-open':sheet(true);break;
   case 'sheet-search':sheet(true,true);break;
   case 'sheet-close':sheet(false);$('[data-act="sheet-open"]').focus();break;
   case 'logout':state.role='visitor';sheet(false);toast('You are logged out.');location.hash='#/home';route();break;
   case 'login':location.hash='#/login';$('#toast').classList.remove('show');break;
   case 'trailer':toast('Opens the TMDB trailer link in a new tab.');break;
   case 'download':toast('Download is a placeholder and does nothing yet.');break;
   case 'undo':{const u=state.lastRm;if(u){state.favs.splice(Math.min(u.i,state.favs.length),0,u.id);state.lastRm=null;if(curPath()==='favorites')$('#main').innerHTML=renderFav();toast('Restored.')}break}
   case 'resend':toast('Email sent again. Check your inbox.');startResend();break;
   case 'del-open':$('#del-panel').hidden=false;a.setAttribute('aria-expanded','true');a.hidden=true;$('#f-del').focus();break;
   case 'del-cancel':$('#del-panel').hidden=true;$('#del-open').hidden=false;$('#del-open').setAttribute('aria-expanded','false');$('#del-open').focus();$('#f-del').value='';$('#del-go').disabled=true;break;
   case 'del-go':state.role='visitor';toast('Your account was deleted.');location.hash='#/home';break;
  }
});
function userAct(a){
  const id=+a.dataset.id,u=state.users.find(x=>x.id===id),k=a.dataset.uact;
  if(k==='role')return;
  if(k==='block'){if(u.status==='blocked'){u.status=u.prev||'active';toast(`${esc(u.name)} can log in again.`)}else{u.prev=u.status;u.status='blocked';toast(`${esc(u.name)} is blocked and signed out.`)}}
  if(k==='ask')state.confirmId=id;
  if(k==='cancel')state.confirmId=null;
  if(k==='delete'){state.users=state.users.filter(x=>x.id!==id);state.confirmId=null;toast(`${esc(u.name)} was deleted.`)}
  $('#ubody').innerHTML=rowsHtml();
  const f=$(`[data-id="${id}"] [data-uact="${k==='ask'?'delete':'block'}"]`)||$(`[data-id="${id}"] [data-uact="ask"]`);if(f)f.focus();
}
document.addEventListener('change',e=>{
  const s=e.target.closest('[data-uact="role"]');if(!s)return;
  const u=state.users.find(x=>x.id===+s.dataset.id);u.role=s.value;toast(`${esc(u.name)} is now ${s.value==='admin'?'an admin':'a user'}.`);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='uq'){state.q=t.value;state.confirmId=null;$('#ubody').innerHTML=rowsHtml();return}
  if(t.id==='f-del'){$('#del-go').disabled=t.value.trim()!=='DELETE';return}
  const f=t.closest('[data-f]');if(f&&f.dataset.err==='1')setErr(t.form,f.dataset.f,'');
  const form=t.form;if(!form)return;
  if(form.id==='f-reg'&&t.name==='pw')updRules('r-reg',t.value);
  if(form.id==='f-pw'&&t.name==='nw')updRules('r-acc',t.value);
});
document.addEventListener('focusout',e=>{
  const t=e.target,form=t.form;if(!form||!t.name)return;
  if(t.name==='email'&&t.value)setErr(form,'email',checks.email(t.value.trim()));
  if(t.name==='pw2'&&t.value||t.name==='cf'&&t.value){const o=form.id==='f-reg'?'pw':'nw';setErr(form,t.name,t.value!==val(form,o)?'The passwords do not match.':'')}
});
document.addEventListener('submit',e=>{
  const form=e.target;e.preventDefault();
  if(form.matches('[data-search]')){const v=form.q.value.trim();if(v){sheet(false);location.hash='#/search?q='+encodeURIComponent(v)}return}
  const fail=(name,msg)=>{const bad=setErr(form,name,msg);return bad};
  const first=()=>{const f=$('[data-err="1"] input',form);if(f)f.focus();};
  if(form.id==='f-login'){
    clearBanner(form);const em=val(form,'email').toLowerCase(),pw=$('[name=pw]',form).value;
    let bad=[fail('email',checks.email(em)),fail('pw',checks.pw(pw))].some(Boolean);if(bad){first();return}
    if(em==='unverified@cinevault.test'){banner(form,`Verify your email before logging in. We sent a link to ${esc(em)}. <a class="tlink" href="#/check-email?mode=verify&email=${encodeURIComponent(em)}">Resend it</a>.`);return}
    if(em==='blocked@cinevault.test'){banner(form,'This account has been blocked. Contact support if you think this is a mistake.');return}
    if((em==='ana@cinevault.test'||em==='admin@cinevault.test')&&pw==='Vault#2026'){state.role=em.startsWith('admin')?'admin':'user';toast('Welcome back.');location.hash=state.role==='admin'?'#/admin/users':'#/favorites';return}
    fail('pw','');banner(form,'Email or password is incorrect. Check both and try again, or <a class="tlink" href="#/forgot">reset your password</a>.');
  }
  if(form.id==='f-reg'){
    const em=val(form,'email').toLowerCase(),pw=$('[name=pw]',form).value,p2=$('[name=pw2]',form).value;
    let bad=[fail('name',checks.name(val(form,'name'))),fail('email',checks.email(em)||(em==='taken@cinevault.test'?'An account with this email already exists. Log in instead.':'')),fail('pw',checks.newpw(pw)),fail('pw2',!p2?'Confirm your password.':p2!==pw?'The passwords do not match.':'')].some(Boolean);
    if(bad){first();return}location.hash='#/check-email?mode=verify&email='+encodeURIComponent(em);
  }
  if(form.id==='f-forgot'){const em=val(form,'email');const m=checks.email(em);if(fail('email',m)){first();return}location.hash='#/check-email?mode=reset&email='+encodeURIComponent(em)}
  if(form.id==='f-prof'){
    clearBanner(form);const bad=[fail('name',checks.name(val(form,'name'))),fail('email',checks.email(val(form,'email')))].some(Boolean);if(bad){first();return}
    const changed=val(form,'email')!==ME[state.role].email;ME[state.role].name=val(form,'name');renderChrome();
    banner(form,changed?`Saved. We sent a link to ${esc(val(form,'email'))}; the new address applies once you confirm it.`:'Saved. Your name is updated.',true);
  }
  if(form.id==='f-pw'){
    clearBanner(form);const o=$('[name=old]',form).value,n=$('[name=nw]',form).value,c=$('[name=cf]',form).value;
    const bad=[fail('old',!o?'Enter your current password.':o!=='Vault#2026'?'That is not your current password. Try again or reset it by email.':''),fail('nw',checks.newpw(n)||(n===o&&o?'Choose a password you have not used here before.':'')),fail('cf',!c?'Confirm the new password.':c!==n?'The passwords do not match.':'')].some(Boolean);
    if(bad){first();return}form.reset();updRules('r-acc','');banner(form,'Password updated. Other devices are signed out.',true);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('open')){sheet(false);$('[data-act="sheet-open"]')?.focus()}});

/* boot */
if(!location.hash)history.replaceState(null,'','#/home');
route();
</script>
</body>
</html>
